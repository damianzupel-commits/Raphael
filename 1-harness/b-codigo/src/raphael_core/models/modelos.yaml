# Modelos de Raphael: qué IA usa cada ROL, en qué orden de ESCALONES.
# Tres escalones (pago, gratis, local). Cambiar de proveedor = editar este archivo.
# Las claves NUNCA van acá: cada proveedor nombra su variable de entorno.
#
# Decisión del 24 nov 2026: el tráfico REAL (mensajes de clientes) va por OpenRouter, escalón "pago".
# NVIDIA (build.nvidia.com) queda solo para desarrollo y pruebas: sus términos oficiales
# (docs.api.nvidia.com/nim/docs/product, revisado 24 nov 2026) dicen que el acceso de developer es "solo para
# prototipos, investigación, desarrollo y pruebas" y que servir a usuarios finales reales es producción, que exige
# licencia NVIDIA AI Enterprise. Por eso NINGÚN rol cae a NVIDIA por defecto; para probar sin gastar, poné
# "gratis" en la cadena del rol a mano (y sin mensajes reales de clientes).
#
# OpenRouter (revisado 24 nov 2026 en openrouter.ai/docs y /privacy):
#  - no guarda prompts ni respuestas salvo que se active el logging, y no los usa para entrenar;
#  - pero algunos proveedores de modelos SÍ pueden entrenar o retener: por eso cada pedido manda
#    provider.data_collection=deny (el valor por defecto de OpenRouter es "allow");
#  - se paga con tarjeta (Stripe) o cripto (Coinbase), compra mínima USD 5, comisión 5,5 %.
#  SUPUESTO sin verificar: el modelo y los precios de abajo. Confirmar el slug y el precio en openrouter.ai/models.
#  Los datos de clientes siguen saliendo a un tercero: decirlo en Legales (Ley 25.326, verificar fuente vigente).
#
# Roles: mando (el orquestador), voz (lo que te habla), ruteo (decisiones chicas), jefe (planifica y
# sintetiza), cocinero, efimero. Los nombres viejos (intencion, redaccion, resumen, secretaria, orquestador,
# ayudante) se traducen solos. Cálculos, estados, avisos y permisos NUNCA pasan por la IA.

providers:
  openrouter:
    base_url: https://openrouter.ai/api/v1
    model: mistralai/mistral-small-3.2-24b-instruct   # SUPUESTO: modelo chico y barato; verificar slug y precio
    api_key_env: OPENROUTER_API_KEY
    usd_per_million_in: 0.15     # SUPUESTO (precio de Mistral Small según un blog de terceros); verificar
    usd_per_million_out: 0.60    # SUPUESTO; verificar. Más 5,5 % de comisión de OpenRouter al comprar créditos
    rpm: 60                      # SUPUESTO conservador; los modelos de pago no tienen tope de pedidos de la plataforma
    extra:
      provider: {data_collection: deny}   # no rutear a proveedores que puedan guardar o entrenar con los datos
  nvidia:
    base_url: https://integrate.api.nvidia.com/v1
    model: nvidia/nemotron-3.5-super-vl-120b-a12b    # el de JarvisRemote (verificado allá el 11 nov 2026)
    api_key_env: NVIDIA_API_KEY
    usd_per_million_in: 0
    usd_per_million_out: 0
    rpm: 40                       # varía por modelo (foro de NVIDIA, 21 nov 2026)
    extra:
      chat_template_kwargs: {enable_thinking: false}  # sin razonar responde en ~1 s (medido en JarvisRemote)

tiers:
  pago:   [openrouter]  # producción: tráfico real, con tope mensual en dólares (paid_cap_usd_month)
  gratis: [nvidia]      # SOLO desarrollo y pruebas, sin mensajes reales de clientes; ningún rol lo usa por defecto
  local:  []            # cuando haya modelo local (Ollama o LM Studio en localhost), ponerlo acá.
                        # Lo privado solo usa locales: sin ninguno cae a reglas (se mira la dirección, no el nombre)

roles:
  mando:    [pago]
  voz:      [pago]
  jefe:     [pago]
  cocinero: [pago]
  efimero:  [pago]
  ruteo:    [pago]

# Por brigada o ayudante: "rol.id" -> escalones. Ej.: efimero.investigacion-scout: [gratis]
overrides: {}

# Lo privado solo usa modelos que corren en la PC (si no hay, sigue con reglas). Decisión de JarvisRemote.
private: [memoria-cerebro, investigacion-forense]

paid_tiers: [pago]
paid_cap_usd_month: 5      # SUPUESTO: tope de USD por mes en el escalón pago (0 = solo proveedores sin costo). Ajustar al volumen real
