[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raphael-selfrepair"
dynamic = ["version"]
description = "Brigada Autorreparación de Raphael (harness v2): propone y aplica arreglos al propio código, con aprobación, líneas rojas y vuelta atrás."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["raphael-core>=2.0.0rc3", "pydantic>=2.5", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points."raphael.brigades"]
autorreparacion = "raphael_selfrepair"

[tool.setuptools.dynamic]
version = {attr = "raphael_selfrepair.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
raphael_selfrepair = ["manifest.yaml"]

[tool.pytest.ini_options]
testpaths = ["../c-salud/pruebas"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]
