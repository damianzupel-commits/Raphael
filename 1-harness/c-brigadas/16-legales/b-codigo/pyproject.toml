[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raphael-legales"
dynamic = ["version"]
description = "Brigada Legales de Raphael (harness v2): documentos, cumplimiento, riesgos y archivo para un pyme argentino."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["raphael-core>=2.0.0rc3", "pydantic>=2.5", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points."raphael.brigades"]
legales = "raphael_legales"

[tool.setuptools.dynamic]
version = {attr = "raphael_legales.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
raphael_legales = ["manifest.yaml"]

[tool.pytest.ini_options]
testpaths = ["../c-salud/pruebas"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]
ignore = ["E501"]   # textos legales y mensajes en español: se cortan por sentido, no por columna
