[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raphael-empresas"
dynamic = ["version"]
description = "Brigada Empresas de Raphael (harness v2): atención, encargos, cobros, agenda, avisos, tareas y tienda."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["raphael-core>=2.0.0rc3", "pydantic>=2.5", "pyyaml>=6", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "raphael-orchestrator"]

[project.entry-points."raphael.brigades"]
empresas = "raphael_empresas"

[tool.setuptools.dynamic]
version = {attr = "raphael_empresas.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
raphael_empresas = ["manifest.yaml"]

[tool.pytest.ini_options]
testpaths = ["../c-salud/pruebas"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]
