[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raphael-trading"
dynamic = ["version"]
description = "Brigada Trading de Raphael (harness v2): señales, backtest y vigilancia. Nada se ejecuta sin aprobación."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["raphael-core>=2.0.0rc3", "pydantic>=2.5", "pyyaml>=6", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]
ibkr = ["ib_async>=1.0"]

[project.entry-points."raphael.brigades"]
trading = "raphael_trading"

[tool.setuptools.dynamic]
version = {attr = "raphael_trading.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
raphael_trading = ["manifest.yaml"]

[tool.pytest.ini_options]
testpaths = ["../c-salud/pruebas"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]

[tool.ruff.lint.per-file-ignores]
# motor portado de JarvisRemote tal cual (el método está validado ahí): campos o/h/l/c y varias sentencias por línea
"src/raphael_trading/engine.py" = ["E702", "E741", "E501"]
"src/raphael_trading/signals.py" = ["E702", "E741", "E501"]
"src/raphael_trading/backtest.py" = ["E702", "E741", "E501"]
