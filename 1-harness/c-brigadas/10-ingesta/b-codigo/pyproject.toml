[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raphael-ingesta"
dynamic = ["version"]
description = "Brigada Ingesta de Raphael (harness v2): YouTube, web y arXiv al vault."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["raphael-core>=2.0.0rc3", "httpx>=0.27"]

[project.optional-dependencies]
youtube = ["yt-dlp"]
dev = ["pytest>=8"]

[project.entry-points."raphael.brigades"]
ingesta = "raphael_ingesta"

[tool.setuptools.dynamic]
version = {attr = "raphael_ingesta.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
raphael_ingesta = ["manifest.yaml"]

[tool.pytest.ini_options]
testpaths = ["../c-salud/pruebas"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]
