[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raphael-harness"
dynamic = ["version"]
description = "Harness de Raphael: el punto de reunión de las brigadas (contrato, perfil, políticas, modelos, eventos, registro)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5", "pyyaml>=6", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
raphael = "raphael_harness.cli:main"

[tool.setuptools.package-data]
raphael_harness = ["*.yaml"]

[tool.setuptools.dynamic]
version = {attr = "raphael_harness.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
