[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raphael-servidor"
dynamic = ["version"]
description = "Servidor de Raphael para el equipo del cliente: panel de la dueña, WhatsApp/Instagram, licencia, backups e instalador."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["raphael-harness>=0.4,<1.0", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.package-data]
raphael_servidor = ["web/*", "*.yaml"]

[project.scripts]
raphael-servidor = "raphael_servidor.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "raphael_servidor.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
