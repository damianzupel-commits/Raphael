[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raphael-relay"
dynamic = ["version"]
description = "Relay de Raphael: recibe los webhooks de Meta en la nube y los encola por instalación."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.dynamic]
version = {attr = "raphael_relay.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
