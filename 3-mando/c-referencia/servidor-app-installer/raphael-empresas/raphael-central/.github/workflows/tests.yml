name: tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: raphael-central
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml httpx fastapi uvicorn pytest
      - run: cd raphael-central && python -m pytest -q
