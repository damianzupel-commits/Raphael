<!doctype html>
<meta charset="utf-8">
<title>Raphael — Centro de Mando · Alma (preview v2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#03050B;
    --cyan:#38E1FF; --cyan-soft:rgba(56,225,255,.60); --cyan-dim:rgba(56,225,255,.26);
    --gold:#FFD98A; --gold-deep:#F2B84B; --gold-soft:rgba(255,217,138,.55);
    --violet:#A779FF; --violet-deep:#7A4FFF; --violet-soft:rgba(167,121,255,.5);
    --amber:#FFB547;
    --ink:#d7e6f2; --muted:#5f7792; --line:rgba(56,225,255,.30);
    --glass:rgba(8,14,26,.46); --panel:rgba(6,11,21,.66);
    --mono:"JetBrains Mono","Fira Code","Consolas",ui-monospace,monospace;
    --sage:"Cinzel",serif;
    --notch:11px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:
      radial-gradient(760px 620px at 50% 46%,rgba(167,121,255,.12),transparent 60%),
      radial-gradient(1000px 720px at 50% 46%,rgba(255,217,138,.07),transparent 62%),
      radial-gradient(900px 640px at 98% 104%,rgba(56,225,255,.06),transparent 58%),
      var(--bg);
    color:var(--ink);font-family:var(--mono);overflow:hidden;height:100vh;font-feature-settings:"liga" 0}
  /* substrato técnico (grilla cian) + viñeta */
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:linear-gradient(rgba(56,225,255,.04) 1px,transparent 1px),
      linear-gradient(90deg,rgba(56,225,255,.04) 1px,transparent 1px);
    background-size:46px 46px;mask:radial-gradient(circle at 50% 44%,#000,transparent 88%)}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:60;
    background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.10) 3px);opacity:.22;mix-blend-mode:multiply}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:.75}}
  .mote{position:fixed;width:2px;height:2px;border-radius:50%;z-index:0;animation:tw 5s ease-in-out infinite}

  .hud{position:relative;background:var(--glass);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
    clip-path:polygon(var(--notch) 0,100% 0,100% calc(100% - var(--notch)),calc(100% - var(--notch)) 100%,0 100%,0 var(--notch))}
  .hud::after{content:"";position:absolute;inset:0;clip-path:inherit;padding:1px;background:var(--line);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:2}

  .wrap{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;padding:14px 16px;gap:12px}

  /* ---------- header ---------- */
  .top{display:flex;align-items:center;gap:14px}
  .brand{display:flex;align-items:center;gap:12px}
  .brandmark{width:30px;height:30px;flex:none}
  .brand .nm{font-family:var(--sage);font-size:17px;letter-spacing:5px;color:var(--gold);
    text-shadow:0 0 14px rgba(255,217,138,.45)}
  .brand .s{color:var(--muted);font-size:9px;letter-spacing:4px;margin-top:1px}
  .top .sp{flex:1}
  .hudbar{display:flex;--notch:8px}
  .hudbar .tag{font-size:10px;letter-spacing:1.5px;padding:6px 12px;color:var(--muted);text-transform:uppercase;border-left:1px solid var(--line)}
  .hudbar .tag:first-child{border-left:none}
  .tag .v{color:var(--cyan)} .tag .on{color:#44f0b0}
  .clock{font-variant-numeric:tabular-nums;color:var(--cyan);letter-spacing:2px;font-size:13px;padding:6px 12px}

  .main{flex:1;display:grid;grid-template-columns:1fr 330px;gap:12px;min-height:0}

  /* ---------- escenario: la entidad en el centro ---------- */
  .stage{position:relative;overflow:hidden;
    background:radial-gradient(circle at 50% 48%,rgba(167,121,255,.08),transparent 58%),var(--panel)}
  .beams{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
  .pulse{position:absolute;width:7px;height:7px;border-radius:50%;z-index:2;transform:translate(-50%,-50%);
    background:radial-gradient(circle,#fff,var(--cyan) 55%,transparent 72%);
    filter:drop-shadow(0 0 6px var(--cyan));transition:left 1s linear,top 1s linear,opacity 1s ease}

  .entity{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;text-align:center;width:300px;pointer-events:none}
  .halo{position:relative;width:188px;height:188px;margin:0 auto 14px}
  /* aura divina detrás (dorado→violeta) */
  .halo::before{content:"";position:absolute;inset:-34px;border-radius:50%;z-index:0;
    background:radial-gradient(circle,rgba(255,217,138,.26),rgba(167,121,255,.16) 45%,transparent 70%);
    animation:aura 6s ease-in-out infinite}
  @keyframes aura{0%,100%{transform:scale(.94);opacity:.8}50%{transform:scale(1.08);opacity:1}}

  /* sigilo: geometría sagrada en oro, girando */
  .sigil{position:absolute;inset:0;z-index:2}
  .sigil svg{width:100%;height:100%;overflow:visible}
  .sg-rot{transform-origin:50% 50%;transform-box:fill-box;animation:spin 48s linear infinite}
  .sg-rot2{transform-origin:50% 50%;transform-box:fill-box;animation:spin 72s linear infinite reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  .sigil line,.sigil circle,.sigil polygon{filter:drop-shadow(0 0 3px rgba(255,217,138,.6))}

  /* núcleo vivo: calor dorado al centro → violeta → cian al borde */
  .core{position:absolute;left:50%;top:50%;width:92px;height:92px;transform:translate(-50%,-50%);z-index:3;border-radius:50%;
    background:radial-gradient(circle at 50% 44%,#fff 0%,#fff3d4 14%,var(--gold) 34%,var(--violet) 68%,rgba(56,225,255,.5) 90%,transparent 100%);
    box-shadow:0 0 26px rgba(255,217,138,.6),0 0 60px rgba(167,121,255,.4);
    animation:breathe 4.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(.95);filter:brightness(.92)}
    50%{transform:translate(-50%,-50%) scale(1.05);filter:brightness(1.12)}}
  /* "pupila"/consciencia: un punto que dilata segun el estado */
  .iris{position:absolute;left:50%;top:44%;width:16px;height:16px;transform:translate(-50%,-50%);z-index:4;border-radius:50%;
    background:radial-gradient(circle,#fff,rgba(255,243,212,.5) 60%,transparent);
    box-shadow:0 0 12px #fff;animation:iris 4.6s ease-in-out infinite}
  @keyframes iris{0%,100%{transform:translate(-50%,-50%) scale(.8);opacity:.85}50%{transform:translate(-50%,-50%) scale(1.15);opacity:1}}
  /* motas de energía orbitando (vida) */
  .spark{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;z-index:3;
    background:var(--gold);box-shadow:0 0 6px var(--gold);transform-origin:0 0}

  /* --- estado del alma: pensando / autorizando --- */
  .entity.thinking .core{animation-duration:2.4s;box-shadow:0 0 36px rgba(255,217,138,.85),0 0 80px rgba(167,121,255,.55)}
  .entity.thinking .iris{animation-duration:2.4s}
  .entity.thinking .sg-rot{animation-duration:14s}
  .entity.thinking .sg-rot2{animation-duration:22s}
  .entity.auth .core{background:radial-gradient(circle at 50% 44%,#fff 0%,#ffe9c4 16%,var(--amber) 44%,#b5701f 86%,transparent 100%);
    box-shadow:0 0 34px rgba(255,181,71,.8),0 0 70px rgba(255,181,71,.4)}

  .entity .k{font-family:var(--sage);font-size:10px;letter-spacing:5px;color:var(--gold-deep)}
  .entity h1{font-family:var(--sage);margin:6px 0 2px;font-size:26px;letter-spacing:7px;color:var(--gold);font-weight:600;
    text-shadow:0 0 18px rgba(255,217,138,.5)}
  .entity .model{font-size:10px;letter-spacing:2px;color:var(--violet);margin-top:2px}
  .estado{margin-top:11px;font-size:11px;letter-spacing:2px;color:var(--gold);animation:blink 1.6s steps(1) infinite}
  .estado.auth{color:var(--amber)} .estado.idle{color:var(--muted)}
  @keyframes blink{50%{opacity:.4}}
  .entity .tk{margin-top:8px;font-size:10px;letter-spacing:1px;color:var(--muted)}
  .entity .tk b{font-size:16px;color:var(--gold);margin-right:4px}

  /* ---------- nodos de brigada (máquina = cian) ---------- */
  .grid{position:absolute;inset:0;z-index:4;pointer-events:none}
  .node{position:absolute;transform:translate(-50%,-50%);z-index:4;width:148px;pointer-events:auto;cursor:pointer;
    --notch:9px;padding:9px 11px;transition:filter .25s,background .25s}
  .node .ic{width:25px;height:25px;color:var(--cyan)}
  .node.amber .ic{color:var(--amber)}
  .node .nh{display:flex;align-items:center;gap:8px}
  .node .nm{font-size:10px;font-weight:600;letter-spacing:.8px;line-height:1.15;text-transform:uppercase}
  .node .st{margin-left:auto;width:7px;height:7px;flex:none;background:var(--muted);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
  .node .nr{display:flex;align-items:baseline;gap:6px;margin-top:6px}
  .node .nr b{font-size:16px;color:#fff;font-variant-numeric:tabular-nums}
  .node .nr span{font-size:8.5px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
  .node::after{background:var(--cyan-dim)}
  .node.run{filter:drop-shadow(0 0 12px rgba(56,225,255,.55))}
  .node.run::after{background:var(--cyan)}
  .node.run .st{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
  .node.amber::after{background:rgba(255,181,71,.3)}
  .node.amber.run{filter:drop-shadow(0 0 12px rgba(255,181,71,.55))}
  .node.amber.run::after{background:var(--amber)}
  .node.amber.run .st{background:var(--amber);box-shadow:0 0 8px var(--amber)}
  .node:hover{background:rgba(56,225,255,.06)}
  .node.future{opacity:.3;pointer-events:none}
  .node .scan{position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:0}
  .node.run .scan{opacity:1;animation:scan 2.2s linear infinite}
  .node.amber.run .scan{background:linear-gradient(90deg,transparent,var(--amber),transparent)}
  @keyframes scan{0%{top:0}100%{top:100%}}

  /* ---------- feed (terminal, con la voz del alma en dorado) ---------- */
  .side{display:flex;flex-direction:column;overflow:hidden;--notch:12px}
  .side h3{margin:0;padding:11px 14px;font-size:10px;letter-spacing:4px;color:var(--muted);
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .side h3 .d{width:6px;height:6px;background:var(--gold);box-shadow:0 0 8px var(--gold);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
  .log{flex:1;overflow-y:auto;padding:4px 0;font-size:11.5px;line-height:1.5}
  .log .ln{padding:5px 14px;border-bottom:1px solid rgba(56,225,255,.06);opacity:0;animation:in .3s forwards;white-space:pre-wrap;word-break:break-word}
  @keyframes in{to{opacity:1}}
  .log .t{color:var(--muted);font-size:10px}
  .log .who{letter-spacing:1px}
  .log .r .who{color:var(--gold)} .log .r{color:#ede0c4}      /* voz de Raphael = dorada */
  .log .b .who{color:var(--cyan)} .log .b{color:var(--ink)}   /* brigada = cian */
  .log .m .who{color:var(--amber)} .log .m{color:#eaf4ff}     /* maestro */

  .cmd{border-top:1px solid var(--line);padding:11px 14px;display:flex;align-items:center;gap:9px;background:rgba(255,217,138,.03)}
  .cmd .pr{color:var(--gold);font-size:12px;letter-spacing:1px;white-space:nowrap}
  .cmd .field{flex:1;position:relative;display:flex;align-items:center}
  .cmd input{width:100%;background:transparent;border:none;border-bottom:1px solid var(--cyan-dim);color:var(--cyan);
    font-family:var(--mono);font-size:12px;letter-spacing:.5px;padding:5px 2px;outline:none}
  .cmd input::placeholder{color:var(--muted);letter-spacing:1px}
  .cmd input:focus{border-bottom-color:var(--gold)}
  .cmd .cur{width:8px;height:15px;background:var(--gold);margin-left:2px;animation:blink 1.1s steps(1) infinite;flex:none}

  .seis{border-top:1px solid var(--line);padding:9px 14px}
  .seis .lbl{font-size:9px;letter-spacing:2px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between}
  .eq{display:flex;align-items:flex-end;gap:2px;height:32px}
  .eq i{flex:1;background:linear-gradient(var(--cyan),rgba(56,225,255,.05));transition:height .3s ease}
  .tiers{display:flex;gap:6px;margin-top:9px}
  .tiers span{font-size:8.5px;letter-spacing:1.5px;color:var(--muted);padding:3px 7px;border:1px solid var(--cyan-dim)}
  .tiers span.hot{color:var(--cyan);border-color:var(--cyan);box-shadow:inset 0 0 8px rgba(56,225,255,.3)}

  .foot{font-size:9px;letter-spacing:2px;color:var(--muted);text-align:center;padding-top:2px}
  .foot b{color:var(--gold)}
</style>

<div class="wrap">
  <div class="top">
    <div class="brand">
      <div class="brandmark">
        <svg viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="20" r="15" stroke="var(--gold-soft)" stroke-width="1"/>
          <polygon points="20,7 31,26 9,26" stroke="var(--gold)" stroke-width="1" fill="none"/>
          <polygon points="20,33 9,14 31,14" stroke="var(--gold)" stroke-width="1" fill="none"/>
          <circle cx="20" cy="20" r="4.5" fill="var(--gold)"/>
        </svg>
      </div>
      <div><div class="nm">RAPHAEL</div><div class="s">CENTRO DE MANDO</div></div>
    </div>
    <div class="sp"></div>
    <div class="hud hudbar">
      <div class="tag">SISTEMA · <span class="on">ONLINE</span></div>
      <div class="tag">MODELO · <span class="v" id="mmodel">gpt-oss:120b</span></div>
      <div class="tag">BRIGADAS · <span class="v" id="bact">0 / 9</span></div>
      <div class="clock" id="clock">--:--:--</div>
    </div>
  </div>

  <div class="main">
    <div class="stage hud">
      <svg class="beams" id="beams" viewBox="0 0 100 100" preserveAspectRatio="none">
        <defs>
          <radialGradient id="beamfade" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="var(--cyan)" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="var(--cyan)" stop-opacity="0"/>
          </radialGradient>
        </defs>
      </svg>

      <div class="entity" id="entity">
        <div class="halo">
          <div class="sigil">
            <svg viewBox="0 0 200 200">
              <g class="sg-rot" stroke="var(--gold-soft)" fill="none">
                <circle cx="100" cy="100" r="92" stroke-width="0.8"/>
                <circle cx="100" cy="100" r="70" stroke-width="0.6" stroke-opacity="0.6"/>
                <polygon points="100,20 169,140 31,140" stroke="var(--gold)" stroke-width="1"/>
                <polygon points="100,180 31,60 169,60" stroke="var(--gold)" stroke-width="1"/>
              </g>
              <g class="sg-rot2" stroke="var(--violet-soft)" fill="none">
                <circle cx="100" cy="100" r="54" stroke-width="0.7"/>
                <g id="halo-ticks"></g>
              </g>
            </svg>
          </div>
          <div class="core"></div>
          <div class="iris"></div>
        </div>
        <div class="k">GRAN SABIA · ORQUESTADOR</div>
        <h1>RAPHAEL</h1>
        <div class="model" id="sage-model">gpt-oss:120b</div>
        <div class="estado idle" id="estado">[ EN REPOSO ]</div>
        <div class="tk"><b id="tasks">0</b>tareas en curso</div>
      </div>

      <div class="grid" id="grid"></div>
    </div>

    <div class="side hud">
      <h3><span class="d"></span>FEED EN VIVO</h3>
      <div class="log" id="log"></div>
      <div class="seis">
        <div class="lbl"><span>ACTIVIDAD DEL SISTEMA</span><span id="load">0%</span></div>
        <div class="eq" id="eq"></div>
        <div class="tiers" id="tiers">
          <span>TIER 0</span><span>TIER 1</span><span>TIER 2</span><span>TIER 3</span><span>TIER 4</span>
        </div>
      </div>
      <div class="cmd">
        <span class="pr">&gt; RAPHAEL //</span>
        <div class="field">
          <input id="mc-input" placeholder="ESPERANDO INSTRUCCIÓN" autocomplete="off">
          <span class="cur"></span>
        </div>
      </div>
    </div>
  </div>
  <div class="foot">PREVIEW · RAPHAEL CON <b>ALMA</b> · DATOS SIMULADOS</div>
</div>

<script>
const ICON={
  seg:'<path d="M12 3l7 2.6v4.9c0 4.3-2.9 7.2-7 8.5-4.1-1.3-7-4.2-7-8.5V5.6L12 3z"/>',
  mal:'<path d="M12 4l8.5 15H3.5L12 4z"/><line x1="12" y1="10" x2="12" y2="14.5"/><line x1="12" y1="16.6" x2="12" y2="16.9"/>',
  inv:'<circle cx="11" cy="11" r="5.4"/><line x1="15.2" y1="15.2" x2="20" y2="20"/>',
  geo:'<circle cx="12" cy="12" r="8"/><ellipse cx="12" cy="12" rx="3.4" ry="8"/><line x1="4" y1="12" x2="20" y2="12"/>',
  mem:'<circle cx="6" cy="7" r="1.5"/><circle cx="18" cy="7" r="1.5"/><circle cx="12" cy="17.5" r="1.5"/><path d="M7.3 8.1l4 8M16.7 8.1l-4 8M7.6 6.7h8.8"/>',
  ing:'<path d="M4 14.5V18.5H20V14.5"/><path d="M12 4v8.5M8.5 9.5L12 13l3.5-3.5"/>',
  trd:'<path d="M4 15.5l4-4 3 2.8 5-6.8"/><path d="M4 19.5h16"/>',
  ops:'<rect x="3.5" y="4.5" width="17" height="11"/><line x1="9" y1="19.5" x2="15" y2="19.5"/><line x1="12" y1="15.5" x2="12" y2="19.5"/>',
  rep:'<path d="M14.6 6.3a3.6 3.6 0 01-4.7 4.7l-4.3 4.3 1.8 1.8 4.3-4.3a3.6 3.6 0 004.7-4.7l-2 2-1.6-1.6 1.8-1.9z"/>',
  con:'<rect x="3.5" y="5.5" width="17" height="13"/><polygon points="10.5,9 15,12 10.5,15"/>',
};
function svg(id){return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">'+(ICON[id]||'')+'</svg>';}

const brigades=[
  {id:"seg", nm:"Seguridad",       unit:"hallazgos",  tone:"cyan",  lasts:["Semgrep + Bandit OK","3 hallazgos (1 critico)","nmap: puertos mapeados","sqlmap: inyeccion detectada"]},
  {id:"mal", nm:"Antimalware",     unit:"amenazas",   tone:"amber", lasts:["YARA: scan limpio","FIM: integridad OK","ClamAV actualizado","Sin amenazas"]},
  {id:"inv", nm:"Investigación",   unit:"evidencias", tone:"cyan",  lasts:["Analizando enlace","Hash sha256 guardado","Log firmado (Ed25519)","Caso abierto"]},
  {id:"geo", nm:"Geolocalización", unit:"pines",      tone:"cyan",  lasts:["Geolocalizando IP","Pin en el mapa","ASN resuelto","Infra ubicada"]},
  {id:"mem", nm:"Memoria",         unit:"notas",      tone:"cyan",  lasts:["Propagando activacion","Hebbian +0.3","Consolidando clusters","Recuerdo recuperado"]},
  {id:"ing", nm:"Ingesta",         unit:"docs",       tone:"cyan",  lasts:["Playlist: 3 nuevos","Embebiendo transcript","Nota creada","Web ingerida"]},
  {id:"trd", nm:"Trading",         unit:"señales",    tone:"cyan",  lasts:["Analizando BTC/USDT","Senal: hold","Backtest corriendo","Riesgo evaluado"]},
  {id:"ops", nm:"Operaciones",     unit:"acciones",   tone:"cyan",  lasts:["Leyendo pantalla","Shell ejecutado","Captura tomada","Ventana enfocada"]},
  {id:"rep", nm:"Autorreparación", unit:"propuestas", tone:"amber", auth:true, lasts:["Analizando propio codigo","Propuesta generada","ESPERANDO TU OK","Dry-run listo"]},
  {id:"con", nm:"Contenido",       unit:"piezas",     tone:"cyan",  future:true, lasts:["—"]},
];

// ticks del halo (geometría)
(function(){ let s=""; for(let k=0;k<24;k++){ const a=k/24*Math.PI*2, r1=46,r2=k%2?50:52,
  x1=100+r1*Math.cos(a),y1=100+r1*Math.sin(a),x2=100+r2*Math.cos(a),y2=100+r2*Math.sin(a);
  s+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke-width="0.7"/>`; }
  document.getElementById("halo-ticks").innerHTML=s; })();

const g=document.getElementById("grid");
const N=brigades.length, RX=36, RY=42;
function nodePos(i){ const a=(i/N)*Math.PI*2 - Math.PI/2; return {x:50+RX*Math.cos(a), y:50+RY*Math.sin(a)}; }
brigades.forEach((b,i)=>{
  const p=nodePos(i);
  g.insertAdjacentHTML("beforeend",
    `<div class="node hud${b.future?' future':''}${b.tone==='amber'?' amber':''}" id="c-${b.id}" style="left:${p.x.toFixed(1)}%;top:${p.y.toFixed(1)}%">
       <div class="scan"></div>
       <div class="nh">${svg(b.id)}<div class="nm">${b.nm}</div><span class="st"></span></div>
       <div class="nr"><b id="m-${b.id}">0</b><span>${b.unit}</span></div>
     </div>`);
});

const beams=document.getElementById("beams");
brigades.forEach((b,i)=>{ if(b.future) return; const p=nodePos(i);
  const ln=document.createElementNS("http://www.w3.org/2000/svg","line");
  ln.setAttribute("x1","50");ln.setAttribute("y1","50");ln.setAttribute("x2",p.x.toFixed(1));ln.setAttribute("y2",p.y.toFixed(1));
  ln.setAttribute("stroke","url(#beamfade)");ln.setAttribute("stroke-width","0.3");
  beams.insertBefore(ln, beams.firstChild);
});

// motas de energía orbitando el núcleo (vida)
const halo=document.querySelector(".halo");
for(let k=0;k<4;k++){ const s=document.createElement("div"); s.className="spark";
  const dur=(7+k*2.5), rad=(58+k*9);
  s.style.animation=`orb${k} ${dur}s linear infinite`;
  const st=document.createElement("style");
  st.textContent=`@keyframes orb${k}{to{transform:rotate(360deg) translateX(${rad}px) rotate(-360deg)}}`;
  document.head.appendChild(st); halo.appendChild(s);
}

// motas de fondo
(function(){ const f=document.createDocumentFragment(); for(let k=0;k<30;k++){ const s=document.createElement("div"); s.className="mote";
  s.style.left=(Math.random()*100)+"vw"; s.style.top=(Math.random()*100)+"vh"; s.style.animationDelay=(Math.random()*5)+"s";
  s.style.background=Math.random()<.5?"#ffe6b0":"#bfe9ff"; f.appendChild(s);} document.body.appendChild(f); })();

const stage=document.querySelector(".stage");
function firePulse(i){
  const p=nodePos(i); const d=document.createElement("div"); d.className="pulse";
  d.style.left=p.x+"%"; d.style.top=p.y+"%"; d.style.opacity="1"; stage.appendChild(d);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ d.style.left="50%"; d.style.top="50%"; d.style.opacity="0.2"; }));
  setTimeout(()=>d.remove(),1000);
}

setInterval(()=>{document.getElementById("clock").textContent=new Date().toLocaleTimeString("es-AR")},1000);

const logEl=document.getElementById("log");
function logLine(kind,who,msg){
  const t=new Date().toLocaleTimeString("es-AR");
  const d=document.createElement("div"); d.className="ln "+kind;
  d.innerHTML=`<span class="t">${t}</span>  <span class="who">[${who}]</span> ${msg}`;
  logEl.prepend(d); while(logEl.children.length>40) logEl.lastChild.remove();
}
logLine("m","MAESTRO","sistema iniciado");
logLine("r","RAPHAEL","Despierto. Las brigadas están en órbita, Maestro.");

const eq=document.getElementById("eq");
for(let k=0;k<30;k++){const i=document.createElement("i");i.style.height="12%";eq.appendChild(i);}
const eqBars=[...eq.children];
const tierEls=[...document.querySelectorAll("#tiers span")];
const entity=document.getElementById("entity");
const estadoEl=document.getElementById("estado");

const RVOICE=["Coordinando a las brigadas.","Tengo la lectura, Maestro.","Propago la activación por la memoria.","Vigilo el perímetro.","Preparando el terreno."];
const counts={}; brigades.forEach(b=>counts[b.id]=Math.floor(Math.random()*4));

function tick(){
  let active=0, auth=false;
  brigades.forEach((b,i)=>{
    if(b.future) return;
    const on=Math.random()<.42;
    document.getElementById("c-"+b.id).classList.toggle("run",on);
    if(on){ active++; firePulse(i);
      if(b.auth && Math.random()<.5) auth=true;
      if(Math.random()<.6){counts[b.id]++;document.getElementById("m-"+b.id).textContent=counts[b.id];}
      if(Math.random()<.5) logLine("b",b.nm.toUpperCase(),b.lasts[Math.floor(Math.random()*b.lasts.length)]);
    }
  });
  if(Math.random()<.25) logLine("r","RAPHAEL",RVOICE[Math.floor(Math.random()*RVOICE.length)]);
  const total=brigades.filter(b=>!b.future).length;
  document.getElementById("bact").textContent=active+" / "+total;
  document.getElementById("tasks").textContent=active;

  entity.classList.remove("thinking","auth");
  estadoEl.classList.remove("auth","idle");
  if(auth){ entity.classList.add("auth"); estadoEl.classList.add("auth"); estadoEl.textContent="[ ESPERANDO AUTORIZACIÓN ]"; }
  else if(active>0){ entity.classList.add("thinking"); estadoEl.textContent="[ MEDITANDO ]"; }
  else { estadoEl.classList.add("idle"); estadoEl.textContent="[ EN REPOSO ]"; }

  const load=Math.min(100,Math.round(active/total*100)+Math.floor(Math.random()*18));
  document.getElementById("load").textContent=load+"%";
  eqBars.forEach(bar=>bar.style.height=(8+Math.random()*(12+load))+"%");
  tierEls.forEach(e=>e.classList.remove("hot"));
  if(active>0) tierEls[Math.floor(Math.random()*tierEls.length)].classList.add("hot");
}
tick(); setInterval(tick,2000);
setInterval(()=>eqBars.forEach(bar=>bar.style.height=(8+Math.random()*70)+"%"),300);

const inp=document.getElementById("mc-input");
inp.addEventListener("keydown",e=>{ if(e.key==="Enter" && inp.value.trim()){
  const v=inp.value.trim(); logLine("m","MAESTRO",v); inp.value="";
  entity.classList.add("thinking");
  setTimeout(()=>logLine("r","RAPHAEL","Entendido, Maestro: «"+v+"». (preview: sin backend)"),600);
}});
</script>
