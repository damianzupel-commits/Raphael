<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Vincular celular · Raphael</title>
<style>
  :root{--accent:#35e6ff;--bg:#05070d;--panel:#0b111c;--line:#1b2a3f;--txt:#dfe9f5;--mut:#7d93ac}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(900px 600px at 50% -10%,#0c1a2e,var(--bg) 60%);
    color:var(--txt);font-family:"Segoe UI",system-ui,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
  h1{font-size:15px;letter-spacing:.28em;text-transform:uppercase;font-weight:600;margin:0 0 4px}
  .sub{color:var(--mut);font-size:13px;margin:0 0 22px;text-align:center;max-width:360px;line-height:1.45}
  .qrbox{background:#fff;border-radius:16px;padding:16px;box-shadow:0 0 40px rgba(53,230,255,.18);
    width:260px;height:260px;display:flex;align-items:center;justify-content:center}
  .qrbox img{width:100%;height:100%;image-rendering:pixelated}
  .steps{margin:22px 0 0;max-width:360px;color:var(--mut);font-size:13px;line-height:1.7}
  .steps b{color:var(--txt)}
  .urls{margin-top:18px;font-size:11px;color:var(--mut);font-family:monospace;text-align:center;word-break:break-all}
  .msg{color:var(--mut);font-size:14px;text-align:center;max-width:340px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);
    display:inline-block;margin-right:8px;animation:p 2s infinite}
  @keyframes p{0%,100%{opacity:.5}50%{opacity:1}}
</style>
</head>
<body>
  <div style="display:flex;align-items:center;margin-bottom:14px">
    <span class="dot"></span><h1>Vincular celular</h1>
  </div>
  <p class="sub" id="sub">Escaneá este código desde la app de Raphael en tu celular para sincronizarlo con esta PC.</p>
  <div class="qrbox" id="qrbox"><div class="msg" id="loading">Generando código…</div></div>
  <div class="urls" id="urls"></div>
  <div class="steps">
    1. Abrí la app de <b>Raphael</b> en el celular.<br>
    2. Tocá <b>Vincular / Escanear QR</b>.<br>
    3. Apuntá al código. Listo — queda sincronizado.
  </div>

<script>
(function(){
  const KEY = new URLSearchParams(location.search).get("key") || "";
  const qrbox = document.getElementById("qrbox");
  const sub = document.getElementById("sub");
  const urlsEl = document.getElementById("urls");

  async function load(){
    if (!KEY){
      qrbox.innerHTML = '<div class="msg">Abrí esta pantalla desde la app de Raphael en la PC (falta la credencial).</div>';
      return;
    }
    try{
      const r = await fetch("/api/pairing", { headers: { "Authorization": "Bearer " + KEY } });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const data = await r.json();
      qrbox.innerHTML = '<img alt="QR de vinculación" src="' + data.qr + '">';
      if (data.urls && data.urls.length){
        urlsEl.textContent = "Alcanzable en: " + data.urls.join("  ·  ");
      }
    }catch(e){
      qrbox.innerHTML = '<div class="msg">No se pudo generar el código (¿backend apagado?). ' + e.message + '</div>';
    }
  }
  load();
})();
</script>
</body>
</html>
