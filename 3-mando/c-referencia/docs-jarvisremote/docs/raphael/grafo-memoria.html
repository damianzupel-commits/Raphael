<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Grafo de memoria · Raphael</title>
<style>
  :root{--accent:#9b6bff;--cyan:#35e0ff;--bg:#070a12;--txt:#e8f0ff;--mut:#7f8db0;--line:#1b2a3f}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
    font-family:"Segoe UI",system-ui,sans-serif}
  #graph{position:fixed;inset:0}
  header{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;
    padding:10px 16px;background:linear-gradient(180deg,#070a12cc,#070a1200);z-index:5;pointer-events:none}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
  header h1{font-size:12px;letter-spacing:.26em;margin:0;font-weight:600;text-transform:uppercase}
  header .sub{color:var(--mut);font-size:11px;margin-left:auto}
  #legend{position:fixed;bottom:12px;left:14px;z-index:5;font-size:11px;color:var(--mut);
    background:#0a111ecc;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
  #legend b{color:var(--txt)}
  .lg{display:inline-flex;align-items:center;gap:5px;margin-right:12px}
  .sw{width:9px;height:9px;border-radius:50%}
  #msg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;color:var(--mut);
    font-size:13px;text-align:center;max-width:300px;line-height:1.5}
</style>
</head>
<body>
  <div id="graph"></div>
  <header><span class="dot"></span><h1>Grafo de memoria</h1><span class="sub" id="sub">cargando…</span></header>
  <div id="legend" style="display:none">
    <span class="lg"><span class="sw" style="background:#35e0ff"></span>Raphael</span>
    <span class="lg"><span class="sw" style="background:#9b6bff"></span>humano</span>
    <span><b id="cnt">0</b> notas</span>
  </div>
  <div id="msg">cargando grafo…</div>

<script src="https://unpkg.com/3d-force-graph"></script>
<script>
(function(){
  const KEY = new URLSearchParams(location.search).get("key") || "";
  const hdrs = KEY ? {Authorization:"Bearer "+KEY} : {};
  const msg = document.getElementById("msg");
  function fail(t){ msg.style.display="block"; msg.textContent=t; document.getElementById("sub").textContent="—"; }

  if (typeof ForceGraph3D === "undefined"){ fail("No pude cargar la librería del grafo (sin internet)."); return; }

  fetch("/api/obsidian/graph", {headers:hdrs})
    .then(r=>r.ok ? r.json() : Promise.reject(r.status))
    .then(d=>{
      const rawNodes = d.nodes || [];
      const rawEdges = d.edges || [];
      if(!rawNodes.length){ fail("El vault está vacío (todavía no hay notas)."); return; }
      const nodes = rawNodes.map(n=>({
        id:n.id, name:(n.title||n.id), author:n.author||"", category:n.category||""
      }));
      const ids = new Set(nodes.map(n=>n.id));
      const links = rawEdges
        .filter(e=>ids.has(e.source) && ids.has(e.target))
        .map(e=>({source:e.source, target:e.target}));
      msg.style.display="none";
      document.getElementById("sub").textContent = nodes.length+" notas · "+links.length+" enlaces";
      document.getElementById("cnt").textContent = nodes.length;
      document.getElementById("legend").style.display="block";

      const color = n => (String(n.author).toLowerCase()==="jarvis" ? "#35e0ff" : "#9b6bff");
      const Graph = ForceGraph3D()(document.getElementById("graph"))
        .backgroundColor("#070a12")
        .graphData({nodes, links})
        .nodeLabel(n=>n.name)
        .nodeColor(color)
        .nodeOpacity(0.92)
        .nodeRelSize(3)
        .linkColor(()=> "rgba(130,160,220,0.28)")
        .linkWidth(0.5)
        .linkDirectionalParticles(0)
        .warmupTicks(40)
        .cooldownTime(6000)
        .onNodeClick(n=>{ // centrar la cámara en la nota clickeada
          const dist=90, r=Math.hypot(n.x,n.y,n.z)||1, k=1+dist/r;
          Graph.cameraPosition({x:n.x*k,y:n.y*k,z:n.z*k}, n, 900);
        });
      addEventListener("resize",()=>{ Graph.width(innerWidth).height(innerHeight); });
    })
    .catch(err=>fail("No pude traer el grafo del vault ("+err+")."));
})();
</script>
</body>
</html>
