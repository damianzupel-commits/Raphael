[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raphael-atencion"
dynamic = ["version"]
description = "Brigada Atención: responde con la información cargada, anota dudas y deriva reclamos."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["raphael-harness>=0.1,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points."raphael.brigadas"]
atencion = "raphael_atencion:Atencion"

[tool.setuptools.dynamic]
version = {attr = "raphael_atencion.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
