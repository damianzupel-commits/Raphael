[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raphael-agenda"
dynamic = ["version"]
description = "Brigada Agenda: pide turnos, la dueña confirma, recordatorios automáticos."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["raphael-harness>=0.1,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points."raphael.brigadas"]
agenda = "raphael_agenda:Agenda"

[tool.setuptools.dynamic]
version = {attr = "raphael_agenda.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
