[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raphael-orchestrator"
dynamic = ["version"]
description = "Orquestador de Raphael: ruteo, mando, voz y Secretaria sobre raphael-core (harness v2)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["raphael-core>=2.0.0rc3", "pydantic>=2.5", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points."raphael.orchestrators"]
raphael = "raphael_orchestrator.orchestrator:RaphaelOrchestrator"

[tool.setuptools.dynamic]
version = {attr = "raphael_orchestrator.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]

[tool.ruff.lint.isort]
known-first-party = ["raphael_orchestrator"]
known-third-party = ["raphael_core"]
