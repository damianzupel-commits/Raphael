<!doctype html>
<meta charset="utf-8">
<title>Raphael — Suite</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{
    --bg:#05070d; --panel:rgba(18,24,38,.72); --edge:rgba(120,170,255,.18);
    --ink:#e8f0ff; --muted:#7f8db0; --cyan:#35e0ff; --violet:#9b6bff;
    --green:#36f0a0; --amber:#ffc24b; --red:#ff5c7a; --blue:#4d8cff;
    --teal:#2ee6c8; --pink:#ff6bd6; --orange:#ff9f45;
    --font:"Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:
      radial-gradient(900px 900px at 38% 47%,rgba(89,224,255,.10),transparent 60%),
      radial-gradient(1100px 700px at 12% 0%,rgba(60,110,220,.16),transparent 60%),
      radial-gradient(1000px 700px at 96% 112%,rgba(155,107,255,.17),transparent 55%),
      var(--bg);
    color:var(--ink);font-family:var(--font);overflow:hidden}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:linear-gradient(rgba(90,140,255,.04) 1px,transparent 1px),
      linear-gradient(90deg,rgba(90,140,255,.04) 1px,transparent 1px);
    background-size:40px 40px;mask:radial-gradient(circle at 60% 30%,#000,transparent 85%)}
  @keyframes breathe{0%,100%{transform:scale(.9);filter:brightness(.9)}50%{transform:scale(1.06);filter:brightness(1.2)}}
  .app{display:grid;grid-template-columns:230px 1fr;height:100vh;position:relative;z-index:1}

  /* ---------- Sidebar ---------- */
  .side{border-right:1px solid var(--edge);padding:16px 12px;display:flex;flex-direction:column;gap:14px;
    background:linear-gradient(180deg,rgba(10,14,26,.6),rgba(8,11,20,.3));min-height:0}
  .brand{display:flex;align-items:center;gap:10px;padding:2px 6px}
  .orb{width:26px;height:26px;border-radius:50%;flex:none;
    background:radial-gradient(circle at 50% 40%,#fff,var(--cyan) 45%,#1b63ff 80%);
    box-shadow:0 0 16px var(--cyan),0 0 36px rgba(53,224,255,.4);animation:breathe 3s ease-in-out infinite}
  .brand b{font-size:15px;letter-spacing:3px}
  .brand span{display:block;color:var(--muted);font-size:9px;letter-spacing:4px}
  .slabel{font-size:9px;letter-spacing:2px;color:var(--muted);padding:0 8px;margin-top:4px}
  .brigs{display:flex;flex-direction:column;gap:5px;overflow:auto;min-height:0}
  .brig{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:10px;cursor:pointer;
    border:1px solid transparent;transition:.16s;position:relative}
  .brig:hover{background:rgba(255,255,255,.03);border-color:var(--edge)}
  .brig.active{background:color-mix(in srgb,var(--c) 12%,transparent);border-color:color-mix(in srgb,var(--c) 45%,var(--edge))}
  .brig .bic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13px;flex:none;
    background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 34%,transparent)}
  .brig .bt{font-size:12px;font-weight:600;line-height:1.1}
  .brig .bs{font-size:8.5px;letter-spacing:1px;color:var(--muted)}
  .brig.soon{opacity:.5;cursor:default}
  .brig.soon:hover{background:none;border-color:transparent}
  .brig.active .bt{color:#fff}
  .sfoot{margin-top:auto;font-size:9px;color:var(--muted);padding:0 8px;line-height:1.5}

  /* ---------- Main ---------- */
  .main{min-height:0;overflow:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px}
  .vhead{display:flex;align-items:center;gap:14px}
  .vhead .vic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:none;
    background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
  .vhead h1{margin:0;font-size:20px;letter-spacing:1px}
  .vhead .sub{margin:2px 0 0;font-size:11px;color:var(--muted);letter-spacing:1px}
  .vhead .meta{margin-left:auto;text-align:right;font-size:10px;color:var(--muted);line-height:1.6}
  .vhead .meta b{color:var(--cyan);font-weight:600}
  .vhead .meta .warn{color:var(--amber)}

  .ask{display:flex;gap:10px}
  .ask input{flex:1;background:rgba(8,11,20,.7);border:1px solid var(--edge);border-radius:12px;
    color:var(--ink);font:inherit;font-size:14px;padding:13px 16px;outline:none}
  .ask input:focus{border-color:color-mix(in srgb,var(--c) 55%,var(--edge))}
  .ask button{border:none;border-radius:12px;padding:0 22px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;
    color:#04131a;background:linear-gradient(120deg,var(--cyan),#19b7e6);box-shadow:0 0 22px rgba(53,224,255,.35)}
  .ask button:disabled{opacity:.55;cursor:default;box-shadow:none}

  .cols{display:grid;grid-template-columns:1fr 320px;gap:16px;min-height:0;flex:1}
  @media(max-width:860px){.cols{grid-template-columns:1fr}}
  .card{border:1px solid var(--edge);border-radius:14px;background:var(--panel);padding:14px 16px;
    display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
  .card h3{margin:0 0 10px;font-size:12px;letter-spacing:2px;color:var(--muted);display:flex;align-items:center;gap:8px}
  .card h3 .live{margin-left:auto;font-size:9px;letter-spacing:1px;color:var(--cyan);display:none;align-items:center;gap:5px}
  .card h3 .live.on{display:flex}
  .card h3 .live i{width:7px;height:7px;border-radius:50%;background:var(--cyan);animation:breathe 1.1s ease-in-out infinite}

  /* feed */
  .feed{overflow:auto;display:flex;flex-direction:column;gap:7px;font-size:12.5px;min-height:180px}
  .ev{display:flex;gap:9px;align-items:flex-start;padding:7px 9px;border-radius:9px;background:rgba(255,255,255,.02);
    border:1px solid rgba(120,170,255,.08)}
  .ev .mk{flex:none;width:16px;text-align:center;font-size:12px}
  .ev .tx{flex:1;line-height:1.4;word-break:break-word}
  .ev .tx small{color:var(--muted);font-size:10.5px}
  .ev.ok .mk{color:var(--green)} .ev.bad .mk{color:var(--red)} .ev.run .mk{color:var(--cyan)}
  .ev.final{background:color-mix(in srgb,var(--cyan) 9%,transparent);border-color:color-mix(in srgb,var(--cyan) 30%,transparent)}
  .ev.final .tx{white-space:pre-wrap}
  .empty{color:var(--muted);font-size:12px;text-align:center;padding:26px 10px}

  /* notes */
  .notes{overflow:auto;display:flex;flex-direction:column;gap:8px}
  .note{padding:9px 11px;border-radius:10px;background:rgba(255,255,255,.02);border:1px solid var(--edge)}
  .note .nt{font-size:12.5px;font-weight:600;color:#fff;line-height:1.25}
  .note .nm{font-size:10px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
  .note .tag{font-size:9px;color:var(--cyan);border:1px solid color-mix(in srgb,var(--cyan) 30%,transparent);
    border-radius:8px;padding:1px 6px}

  /* placeholder (brigadas futuras) */
  .soonview{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted)}
  .soonview .big{font-size:40px;margin-bottom:10px;opacity:.6}
  .soonview h2{color:var(--ink);margin:0 0 6px;font-size:18px;letter-spacing:1px}
  .banner{background:color-mix(in srgb,var(--amber) 12%,transparent);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);
    color:var(--amber);font-size:12px;padding:9px 13px;border-radius:10px}
</style>

<div class="app">
  <!-- ===== Sidebar ===== -->
  <aside class="side">
    <div class="brand"><div class="orb"></div><div><b>RAPHAEL</b><span>SUITE</span></div></div>
    <div class="slabel">BRIGADAS</div>
    <div class="brigs" id="brigs"></div>
    <div class="sfoot" id="sfoot">Cada brigada, su app. Scout es la primera.</div>
  </aside>

  <!-- ===== Main ===== -->
  <main class="main" id="main"></main>
</div>

<script>
// ---- Brigadas (Scout activa; el resto, mismo molde, próximamente) ----
const BRIGADES = [
  {id:"scout",   name:"Scout",            sub:"INVESTIGACIÓN", icon:"🔭", color:"var(--cyan)",   ready:true},
  {id:"inv",     name:"Investigación",    sub:"SCOUT · FORENSE", icon:"🔬", color:"var(--teal)",  ready:true},
  {id:"seg",     name:"Seguridad",       sub:"PENTEST",       icon:"🛡️", color:"var(--blue)",   ready:false},
  {id:"anti",    name:"Antimalware",      sub:"DEFENSA",       icon:"🦠", color:"var(--green)",  ready:false},
  {id:"repair",  name:"Autorreparación",  sub:"SELF-HEAL",     icon:"🔧", color:"var(--violet)", ready:false},
  {id:"ops",     name:"Operaciones",      sub:"ACCIONES",      icon:"⚙️", color:"var(--teal)",   ready:false},
  {id:"geo",     name:"Geolocalización",  sub:"OSINT",         icon:"🌐", color:"var(--blue)",   ready:false},
  {id:"trade",   name:"Trading",          sub:"SEÑALES",       icon:"📈", color:"var(--amber)",  ready:false},
  {id:"mem",     name:"Memoria·Cerebro",  sub:"NÚCLEO",        icon:"🧠", color:"var(--pink)",   ready:true},
  {id:"ingest",  name:"Ingesta",          sub:"FUENTES",       icon:"📥", color:"var(--orange)", ready:false},
  {id:"content", name:"Contenido",        sub:"CREACIÓN",      icon:"🎬", color:"var(--violet)", ready:false},
];

const KEY  = new URLSearchParams(location.search).get("key") || "";
const AUTH = KEY ? {Authorization:"Bearer "+KEY} : {};
let busy = false;

// ---- Sidebar render ----
const brigsEl = document.getElementById("brigs");
BRIGADES.forEach(b=>{
  const el = document.createElement("div");
  el.className = "brig"+(b.ready?"":" soon");
  el.style.setProperty("--c", b.color);
  el.innerHTML = `<div class="bic">${b.icon}</div>
    <div><div class="bt">${b.name}</div><div class="bs">${b.ready?b.sub:"PRÓXIMAMENTE"}</div></div>`;
  if(b.ready) el.onclick = ()=>select(b.id);
  el.dataset.id = b.id;
  brigsEl.appendChild(el);
});

function select(id){
  document.querySelectorAll(".brig").forEach(e=>e.classList.toggle("active", e.dataset.id===id));
  const b = BRIGADES.find(x=>x.id===id);
  if(id==="scout") renderScout();
  else if(id==="mem") renderCerebro();
  else if(id==="inv") renderInvestigacion();
  else renderSoon(b);
}

const main = document.getElementById("main");
function esc(s){ return (s==null?"":String(s)).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

// ---- Vista de brigada futura ----
function renderSoon(b){
  main.style.setProperty("--c", b.color);
  main.innerHTML = `<div class="soonview"><div><div class="big">${b.icon}</div>
    <h2>${b.name}</h2><p>Esta brigada se arma con el mismo molde que Scout.<br>Próximamente.</p></div></div>`;
}

// ---- Vista de Scout ----
function renderScout(){
  main.style.setProperty("--c", "var(--cyan)");
  main.innerHTML = `
    <div class="vhead">
      <div class="vic">🔭</div>
      <div><h1>Raphael Scout</h1><p class="sub">INVESTIGACIÓN · INTEL CONTINUO</p></div>
      <div class="meta" id="meta">cargando…</div>
    </div>
    ${KEY ? "" : '<div class="banner">Abrí la Suite con <b>/suite?key=TU_API_KEY</b> para poder investigar (sin key solo se ve).</div>'}
    <div class="ask">
      <input id="topic" placeholder="¿Qué querés que investigue? (ej: estado de los LLM locales en 2026)" ${KEY?"":"disabled"}>
      <button id="go" ${KEY?"":"disabled"}>Investigar</button>
    </div>
    <div class="cols">
      <div class="card" style="--c:var(--cyan)">
        <h3>FEED EN VIVO <span class="live" id="live"><i></i>TRABAJANDO</span></h3>
        <div class="feed" id="feed"><div class="empty">Escribí un tema y dale a Investigar. Vas a ver acá cada paso.</div></div>
      </div>
      <div class="card" style="--c:var(--violet)">
        <h3>NOTAS CAPTURADAS <span style="margin-left:auto;cursor:pointer;color:var(--muted)" id="refresh" title="Actualizar">↻</span></h3>
        <div class="notes" id="notes"><div class="empty">—</div></div>
      </div>
    </div>`;
  document.getElementById("go").onclick = investigate;
  document.getElementById("topic").addEventListener("keydown", e=>{ if(e.key==="Enter") investigate(); });
  document.getElementById("refresh").onclick = loadNotes;
  loadMeta(); loadNotes();
}

async function loadMeta(){
  const el = document.getElementById("meta"); if(!el) return;
  try{
    const r = await fetch("/api/scout/meta", {headers:AUTH});
    if(!r.ok) throw 0;
    const d = await r.json();
    const groq = /groq/i.test(d.endpoint);
    el.innerHTML = `modelo <b>${esc(d.model)}</b><br>${groq?'<b>Groq</b>':esc(d.endpoint)} · ${KEY?'conectado':'<span class="warn">sin key</span>'}`;
  }catch{ el.innerHTML = KEY? '<span class="warn">backend sin responder</span>' : 'sin key'; }
}

async function loadNotes(){
  const el = document.getElementById("notes"); if(!el) return;
  try{
    const r = await fetch("/api/scout/notes?limit=30", {headers:AUTH});
    if(!r.ok) throw 0;
    const d = await r.json();
    if(!d.notes || !d.notes.length){ el.innerHTML = '<div class="empty">Todavía no hay notas capturadas.</div>'; return; }
    el.innerHTML = d.notes.map(n=>`<div class="note">
      <div class="nt">${esc(n.title)}</div>
      <div class="nm">${esc((n.created||"").slice(0,10))}
        ${(n.tags||[]).slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
    </div>`).join("");
  }catch{ el.innerHTML = '<div class="empty">No pude leer las notas.</div>'; }
}

const TOOL_LABEL = {
  research_topic:"buscando en la web",
  obsidian_save_note:"guardando nota",
  obsidian_search_notes:"buscando en tu memoria",
  obsidian_buscar_asociativo:"recorriendo tu memoria por asociación",
  obsidian_analogia:"buscando analogías",
  obsidian_componer:"componiendo",
  obsidian_list_notes:"listando notas",
  fs_write_file:"escribiendo archivo",
  fs_read_file:"leyendo archivo",
  fs_list_dir:"mirando carpeta",
  fs_create_dir:"creando carpeta",
  // jefe de Investigación: delegación + tools del ayudante forense
  investigation_create_case:"creando caso",
  investigation_ingest_csv:"ingestando CSV",
  investigation_ingest_whatsapp_export:"ingestando export de WhatsApp",
  investigation_ingest_telegram_export:"ingestando export de Telegram",
  investigation_ingest_server_log:"ingestando log de servidor",
  investigation_ingest_image:"leyendo EXIF de la imagen",
  investigation_describe_image:"describiendo imagen",
  investigation_ingest_document:"ingestando documento",
  investigation_propose_column_mapping:"proponiendo mapeo de columnas",
  investigation_propose_entities:"proponiendo entidades",
  investigation_propose_fusion:"proponiendo fusión",
  investigation_list_pending_proposals:"listando propuestas pendientes",
  investigation_list_pending_fusions:"listando fusiones pendientes",
  investigation_export_report:"exportando informe",
};

function feedClear(){ document.getElementById("feed").innerHTML = ""; }
function feedAdd(cls, mk, html){
  const feed = document.getElementById("feed");
  const e = document.createElement("div");
  e.className = "ev "+cls; e.innerHTML = `<div class="mk">${mk}</div><div class="tx">${html}</div>`;
  feed.appendChild(e); feed.scrollTop = feed.scrollHeight;
}

function onEvent(ev){
  if(ev.type==="start")       feedAdd("run","🔍", `Investigando: <b>${esc(ev.topic)}</b>`);
  else if(ev.type==="tool")   feedAdd("run","→",  `${esc(TOOL_LABEL[ev.name]||ev.name)} <small>${esc(ev.args||"")}</small>`);
  else if(ev.type==="tool_result") feedAdd(ev.ok?"ok":"bad", ev.ok?"✓":"✗", `<small>${esc(ev.summary||"")}</small>`);
  else if(ev.type==="final")  feedAdd("final","✓", esc(ev.reply||"(sin texto)"));
  else if(ev.type==="error")  feedAdd("bad","✗", `Error: ${esc(ev.message||"")}`);
}

async function investigate(){
  if(busy || !KEY) return;
  const input = document.getElementById("topic");
  const topic = (input.value||"").trim();
  if(!topic) return;
  busy = true;
  document.getElementById("go").disabled = true;
  document.getElementById("live").classList.add("on");
  feedClear();
  try{
    const resp = await fetch("/api/scout/research", {
      method:"POST",
      headers:{"Content-Type":"application/json", ...AUTH},
      body: JSON.stringify({topic})
    });
    if(!resp.ok){ onEvent({type:"error",message:"HTTP "+resp.status}); }
    else {
      const reader = resp.body.getReader(), dec = new TextDecoder();
      let buf = "";
      while(true){
        const {value, done} = await reader.read();
        if(done) break;
        buf += dec.decode(value, {stream:true});
        let i;
        while((i = buf.indexOf("\n")) >= 0){
          const line = buf.slice(0,i).trim(); buf = buf.slice(i+1);
          if(line){ try{ onEvent(JSON.parse(line)); }catch{} }
        }
      }
    }
  }catch(e){ onEvent({type:"error", message:String(e)}); }
  finally{
    busy = false;
    const go = document.getElementById("go"); if(go) go.disabled = false;
    const live = document.getElementById("live"); if(live) live.classList.remove("on");
    loadNotes();
  }
}

// ---- Vista de Cerebro (Memoria / núcleo de conocimiento) ----
function renderCerebro(){
  main.style.setProperty("--c", "var(--pink)");
  main.innerHTML = `
    <div class="vhead">
      <div class="vic">🧠</div>
      <div><h1>Raphael Cerebro</h1><p class="sub">NÚCLEO DE CONOCIMIENTO · LOCAL</p></div>
      <button id="dirBtn" style="margin-left:auto;background:rgba(255,255,255,.04);border:1px solid var(--edge);color:var(--ink);border-radius:10px;padding:7px 12px;font:inherit;font-size:12px;cursor:pointer">✎ Directrices</button>
      <div class="meta" id="meta" style="margin-left:14px">cargando…</div>
    </div>
    ${KEY ? "" : '<div class="banner">Abrí la Suite con <b>/suite?key=TU_API_KEY</b> para preguntarle (sin key solo se ve).</div>'}
    <div class="card" id="dirCard" style="--c:var(--amber);display:none">
      <h3>DIRECTRICES DE CEREBRO <span id="dirStatus" style="margin-left:auto;font-size:10px;color:var(--muted)"></span></h3>
      <textarea id="dirText" style="width:100%;min-height:150px;background:rgba(8,11,20,.7);border:1px solid var(--edge);border-radius:10px;color:var(--ink);font:inherit;font-size:12.5px;padding:10px;outline:none;resize:vertical" ${KEY?"":"disabled"}></textarea>
      <div style="display:flex;justify-content:flex-end;margin-top:8px">
        <button id="dirSave" ${KEY?"":"disabled"} style="border:none;border-radius:10px;padding:8px 18px;font:inherit;font-weight:600;font-size:13px;cursor:pointer;color:#1a1200;background:var(--amber)">Guardar directrices</button>
      </div>
    </div>
    <div class="ask">
      <input id="q" placeholder="¿Qué sé de...? (algo de tus notas: ej. ransomware, o un tema que cargaste)" ${KEY?"":"disabled"}>
      <button id="ask" ${KEY?"":"disabled"}>Preguntar</button>
    </div>
    <div class="cols">
      <div class="card" style="--c:var(--pink)">
        <h3>RESPUESTA <span class="live" id="live"><i></i>PENSANDO</span></h3>
        <div class="feed" id="feed"><div class="empty">Preguntale algo y responde con lo que hay en tu vault, citando las notas fuente. Corre local: tus notas no salen de la PC.</div></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:16px;min-height:0">
        <div class="card" style="--c:var(--violet);flex:1;min-height:200px">
          <h3>GRAFO DE MEMORIA</h3>
          <iframe id="graph" style="flex:1;width:100%;border:none;border-radius:10px;background:#070a12;min-height:160px"></iframe>
        </div>
        <div class="card" style="--c:var(--green);height:168px">
          <h3>LO QUE HIZO SOLO <span style="margin-left:auto;cursor:pointer;color:var(--muted)" id="refreshAct" title="Actualizar">↻</span></h3>
          <div class="notes" id="activity"><div class="empty">—</div></div>
        </div>
      </div>
    </div>`;
  document.getElementById("graph").src = "/grafo-memoria" + (KEY ? ("?key="+encodeURIComponent(KEY)) : "");
  document.getElementById("ask").onclick = askCerebro;
  document.getElementById("q").addEventListener("keydown", e=>{ if(e.key==="Enter") askCerebro(); });
  document.getElementById("refreshAct").onclick = loadCerebroActivity;
  document.getElementById("dirBtn").onclick = toggleDir;
  document.getElementById("dirSave").onclick = saveDirectrices;
  loadCerebroMeta(); loadCerebroActivity();
}

async function toggleDir(){
  const card = document.getElementById("dirCard"); if(!card) return;
  if(card.style.display === "none"){
    card.style.display = "flex";
    try{
      const r = await fetch("/api/brigade/cerebro/directrices", {headers:AUTH});
      if(r.ok){ const d = await r.json(); document.getElementById("dirText").value = d.text || ""; }
    }catch{}
  } else { card.style.display = "none"; }
}

async function saveDirectrices(){
  if(!KEY) return;
  const text = document.getElementById("dirText").value;
  const st = document.getElementById("dirStatus"); st.textContent = "guardando…";
  try{
    const r = await fetch("/api/brigade/cerebro/directrices", {
      method:"POST", headers:{"Content-Type":"application/json", ...AUTH}, body: JSON.stringify({text})
    });
    st.textContent = r.ok ? "✓ guardado (aplica en el próximo turno)" : "✗ error";
  }catch{ st.textContent = "✗ error"; }
}

const ACT_ICON = {reindex:"🔄", consolidacion:"🌙", conclusion:"💡", info:"·"};
async function loadCerebroActivity(){
  const el = document.getElementById("activity"); if(!el) return;
  try{
    const r = await fetch("/api/brigade/cerebro/activity?limit=30", {headers:AUTH});
    if(!r.ok) throw 0;
    const d = await r.json();
    if(!d.items || !d.items.length){ el.innerHTML = '<div class="empty">Todavía no trabajó solo. (Se activa con CEREBRO_PROACTIVE_ENABLED.)</div>'; return; }
    el.innerHTML = d.items.map(it=>`<div class="note" style="padding:6px 9px">
      <div class="nt" style="font-size:11.5px;font-weight:500">${ACT_ICON[it.action]||"·"} ${esc(it.detail)}</div></div>`).join("");
  }catch{ el.innerHTML = '<div class="empty">—</div>'; }
}

async function askCerebro(){
  if(busy || !KEY) return;
  const input = document.getElementById("q");
  const q = (input.value||"").trim();
  if(!q) return;
  busy = true;
  document.getElementById("ask").disabled = true;
  document.getElementById("live").classList.add("on");
  feedClear();
  try{
    const resp = await fetch("/api/brigade/cerebro/chat", {
      method:"POST", headers:{"Content-Type":"application/json", ...AUTH},
      body: JSON.stringify({message:q})
    });
    if(!resp.ok){ onEvent({type:"error",message:"HTTP "+resp.status}); }
    else {
      const reader = resp.body.getReader(), dec = new TextDecoder();
      let buf = "";
      while(true){
        const {value, done} = await reader.read();
        if(done) break;
        buf += dec.decode(value, {stream:true});
        let i;
        while((i = buf.indexOf("\n")) >= 0){
          const line = buf.slice(0,i).trim(); buf = buf.slice(i+1);
          if(line){ try{ onEvent(JSON.parse(line)); }catch{} }
        }
      }
    }
  }catch(e){ onEvent({type:"error", message:String(e)}); }
  finally{
    busy = false;
    const b2 = document.getElementById("ask"); if(b2) b2.disabled = false;
    const live = document.getElementById("live"); if(live) live.classList.remove("on");
  }
}

// El feed de Investigación = el de Scout/Cerebro (onEvent) + la línea de delegación,
// que es lo que muestra a qué ayudante rutea el jefe.
function onInvEvent(ev){
  const name = ev.name || "";
  if(ev.type==="tool" && name.startsWith("delegar:")){
    const forense = name.endsWith("forense");
    feedAdd("run", forense?"🔬":"🔭",
      `Delegó en el ayudante <b>${forense?"Forense":"Scout"}</b> <small>${forense?"modelo local":"web · nube"} · ${esc(ev.args||"")}</small>`);
  } else if(ev.type==="tool_result" && name.startsWith("delegar:")){
    feedAdd("bad","✗", `<small>${esc(ev.summary||"")}</small>`);  // el jefe solo lo emite si el ayudante falló
  } else if(ev.type==="start"){
    feedAdd("run","📨", `Pedido: <b>${esc(ev.topic)}</b>`);
  } else onEvent(ev);
}
