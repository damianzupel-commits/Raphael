# Instalación de la clienta · Raphael Empresas sobre el harness v2 (pieza 15, 22 nov 2026).
# harness (raphael-core) + orquestador en modo `secretary` (raphael-orchestrator) + brigada `empresas`.
#
# OJO: los datos del negocio son los del EJEMPLO piloto (Taller Ejemplo / Ana). Para la clienta real:
#   python ..\raphael-empresas\scripts\perfil_a_instalacion.py <su perfil.yaml> clienta-real.installation.yaml
# o editá `brigades.empresas.config` a mano. Los niveles de cada acción salen del manifiesto de la brigada;
# `autonomy` solo hace falta para cambiarlos (bajar a automático algo irreversible exige confirmed_by).
# Catálogo de la tienda: completar `store.source.url` con el feed JSON o CSV y `store.public_url` con la tienda web.
id: clienta-ropa
edition: cloud
plan: basico
identity:
  assistant: Raphael
  user: Ana
timezone: America/Argentina/Buenos_Aires
limits:
  messages_month: 3000
orchestrator:
  entry: raphael_orchestrator.orchestrator:RaphaelOrchestrator
  config:
    mode: secretary
    routing:
      fallback_cook: empresas/atencion
brigades:
  empresas:
    active: true
    config:
      business:
        name: Taller Ejemplo
        owner: Ana
        tone: voseo_emojis
      info:
        hours: Atendemos de lunes a sábado de 10 a 19
        shipping: Enviamos a todo el país por correo
        payment_methods:
        - transferencia
        - efectivo
        location: Estamos en Rosario, zona centro (la dirección exacta se pasa al
          confirmar un turno)
        faq:
        - question: ¿Trabajan con telas que lleva la clienta?
          answer: Sí, podés traer tu tela; te decimos si sirve para el modelo que
            querés.
          keywords:
          - mi tela
          - traer tela
          - llevo la tela
      payments:
        deposit_pct: 50
        alias: taller.ejemplo
        holder: Ana Pérez
      orders:
        prices:
        - item: vestido
          base: 150000
          days: 30
        - item: vestido de novia
          base: 450000
          days: 60
        - item: traje
          base: 220000
          days: 35
        surcharges:
        - word: largo
          kind: pct
          value: 20
        - word: bordado
          kind: amount
          value: 40000
        required_steps:
        - prenda
        - ocasion
        - fecha
        - detalles
        - referencias
        - medidas
        - nombre
        urgent_if_days_under: 15
      store:
        source:
          kind: none
          url: ''
          format: json
        public_url: ''
        refresh_minutes: 60
        low_stock: 2
      schedule:
        reminder_days_before: 3
        slots:
        - jueves de 16 a 19
        - sábados de 10 a 13
autonomy:
  empresas.enviar_presupuesto: aprobacion
  empresas.confirmar_pago: aprobacion
trust:
  enabled: true
  approvals_to_step_down: 10
