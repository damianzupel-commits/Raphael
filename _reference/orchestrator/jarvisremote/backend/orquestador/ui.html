<!doctype html>
<meta charset="utf-8">
<title>Raphael — Orquestador</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{
    --bg:#05070d; --panel:rgba(18,24,38,.72); --edge:rgba(120,170,255,.18);
    --ink:#e8f0ff; --muted:#7f8db0; --cyan:#35e0ff; --violet:#9b6bff;
    --green:#36f0a0; --amber:#ffc24b; --red:#ff5c7a; --blue:#4d8cff; --teal:#2ee6c8; --pink:#ff6bd6; --orange:#ff9f45;
    --font:"Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;color:var(--ink);font-family:var(--font);overflow:hidden;background:
      radial-gradient(900px 900px at 38% 47%,rgba(89,224,255,.10),transparent 60%),
      radial-gradient(1100px 700px at 12% 0%,rgba(60,110,220,.16),transparent 60%),
      radial-gradient(1000px 700px at 96% 112%,rgba(155,107,255,.17),transparent 55%),var(--bg)}
  @keyframes breathe{0%,100%{transform:scale(.9);filter:brightness(.9)}50%{transform:scale(1.06);filter:brightness(1.2)}}
  .app{max-width:1180px;margin:0 auto;height:100vh;display:flex;flex-direction:column;gap:12px;padding:18px 24px}
  .head{display:flex;align-items:center;gap:14px}
  .orb{width:30px;height:30px;border-radius:50%;flex:none;
    background:radial-gradient(circle at 50% 40%,#fff,var(--cyan) 45%,#1b63ff 80%);
    box-shadow:0 0 16px var(--cyan),0 0 36px rgba(53,224,255,.4);animation:breathe 3s ease-in-out infinite}
  .head h1{margin:0;font-size:18px;letter-spacing:2px}
  .head p{margin:2px 0 0;font-size:10px;color:var(--muted);letter-spacing:2px}
  .head .modelo{margin-left:auto;text-align:right;font-size:10px;color:var(--muted);letter-spacing:1px;line-height:1.6}
  .head .modelo b{color:var(--cyan);font-weight:600;letter-spacing:0}
  .head .chip{background:rgba(8,11,20,.55);border:1px solid var(--edge);color:var(--muted);border-radius:999px;padding:6px 12px;
    font:inherit;font-size:11px;letter-spacing:1px;cursor:pointer}
  .head .chip b{color:var(--text,#dfe7ff)}
  .head .chip.hot{color:var(--orange);border-color:color-mix(in srgb,var(--orange) 55%,transparent)}
  .head .chip.hot b{color:var(--orange)}
  body.sin-proceso .feed .ev.paso{display:none}  /* "Proceso: oculto": queda solo la respuesta (y errores / cortes) */
  .vrow{border-left:3px solid var(--orange)} .vrow .nm b{color:var(--orange)}
  .ask button.mic{background:transparent;color:var(--c);border:1px solid var(--edge);padding:0 16px;font-size:17px}
  .ask button.mic.rec{color:var(--red);border-color:var(--red);animation:breathe 1s infinite}
  .ask button.mic:disabled{opacity:.35}
  .cook{border-left:3px solid var(--pink)}

  /* ---------- Pestañas ---------- */
  .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;flex:none;scrollbar-width:thin;scrollbar-color:var(--edge) transparent}
  .tabs::-webkit-scrollbar{height:6px}
  .tabs::-webkit-scrollbar-track{background:transparent}
  .tabs::-webkit-scrollbar-thumb{background:var(--edge);border-radius:6px}
  .tab{flex:none;display:flex;align-items:center;gap:8px;padding:7px 13px;border-radius:11px;cursor:pointer;
    border:1px solid var(--edge);background:rgba(255,255,255,.03);color:var(--ink);font:inherit;transition:.15s}
  .tab:hover{border-color:color-mix(in srgb,var(--c) 60%,var(--edge))}
  .tab .ti{font-size:14px}
  .tab .tt{font-size:12px;font-weight:600;line-height:1.1;text-align:left}
  .tab .ts{display:block;font-size:8px;letter-spacing:1px;color:var(--muted);font-weight:400}
  .tab.on{background:color-mix(in srgb,var(--c) 16%,transparent);border-color:var(--c);color:#fff}
  .tab.soon{opacity:.45}
  .tab.soon:hover{border-color:var(--edge)}
  .sep{flex:none;width:1px;background:var(--edge);margin:4px 4px}

  .panes{flex:1;min-height:0;display:flex}
  .pane{display:none;flex:1;min-width:0;flex-direction:column;gap:12px;min-height:0}
  .pane.on{display:flex}
  .phead{display:flex;align-items:center;gap:12px}
  .phead .pic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex:none;
    background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
  .phead h2{margin:0;font-size:16px;letter-spacing:1px}
  .phead .sub{margin:2px 0 0;font-size:10px;color:var(--muted);letter-spacing:1px}
  .phead .meta{margin-left:auto;text-align:right;font-size:10px;color:var(--muted);line-height:1.6}
  .phead .meta b{color:var(--cyan);font-weight:600}
  .ghost{background:rgba(255,255,255,.04);border:1px solid var(--edge);color:var(--ink);border-radius:10px;padding:6px 11px;
    font:inherit;font-size:12px;cursor:pointer}
  .ask{display:flex;gap:10px}
  .ask input{flex:1;background:rgba(8,11,20,.7);border:1px solid var(--edge);border-radius:12px;color:var(--ink);
    font:inherit;font-size:14px;padding:11px 14px;outline:none}
  .ask input:focus{border-color:var(--c)}
  .ask button{border:none;border-radius:12px;padding:0 22px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;
    color:#04121a;background:var(--c)}
  .ask button:disabled{opacity:.45;cursor:default}
  .cols{flex:1;min-height:0;display:grid;grid-template-columns:1fr;gap:14px}
  .cols.two{grid-template-columns:1.5fr 1fr}
  .side{display:flex;flex-direction:column;gap:14px;min-height:0}
  .card{min-height:0;background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:13px 15px;
    display:flex;flex-direction:column;gap:9px}
  .card.grow{flex:1}
  .card h3{margin:0;font-size:10px;letter-spacing:2px;color:var(--muted);display:flex;align-items:center;gap:8px}
  .card h3 .r{margin-left:auto;cursor:pointer;color:var(--muted);background:none;border:none;font:inherit;font-size:10px}
  .live{display:none;color:var(--c);font-size:9px;letter-spacing:1px}
  .live.on{display:inline}
  .live i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--c);margin-right:5px;animation:breathe 1s infinite}
  .feed,.list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;min-height:0}
  .empty{color:var(--muted);font-size:12px;line-height:1.6;padding:6px 2px}
  .turn{margin-top:8px;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.04);border-left:3px solid var(--violet);
    font-size:13px;font-weight:600}
  .ev{display:flex;gap:9px;align-items:flex-start;padding:7px 10px;border-radius:9px;background:rgba(8,11,20,.55);
    border:1px solid transparent;font-size:12.5px;line-height:1.5}
  .ev .mk{flex:none;width:18px;text-align:center}
  .ev .tx{min-width:0;overflow-wrap:anywhere}
  .ev small{color:var(--muted);font-size:11px}
  .ev.route{border-color:color-mix(in srgb,var(--teal) 40%,transparent);background:color-mix(in srgb,var(--teal) 10%,transparent)}
  .ev.ok .mk{color:var(--green)} .ev.bad{border-color:color-mix(in srgb,var(--red) 40%,transparent)} .ev.bad .mk{color:var(--red)}
  .ev.final{border-color:color-mix(in srgb,var(--c) 40%,transparent);background:color-mix(in srgb,var(--c) 8%,transparent)}
  .ev.final .tx{white-space:pre-wrap;font-size:13.5px}
  .note{padding:7px 10px;border-radius:9px;background:rgba(8,11,20,.55);border:1px solid var(--edge)}
  .note .nt{font-size:12px;font-weight:600}
  .note .nm{font-size:10.5px;color:var(--muted);line-height:1.5}
  .tag{display:inline-block;margin-left:5px;padding:0 6px;border-radius:6px;background:rgba(155,107,255,.18);font-size:9.5px}
  textarea.dir{width:100%;min-height:130px;background:rgba(8,11,20,.7);border:1px solid var(--edge);border-radius:10px;
    color:var(--ink);font:inherit;font-size:12.5px;padding:10px;outline:none;resize:vertical}
  .soonview{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted)}
  .soonview .big{font-size:40px;margin-bottom:10px;opacity:.6}
  .soonview h2{color:var(--ink);margin:0 0 6px;font-size:18px;letter-spacing:1px}
  .warn{color:var(--amber)}
  .pp{margin:4px 0 0;padding:8px;border-radius:8px;background:rgba(8,11,20,.7);border:1px solid var(--edge);white-space:pre-wrap;
    font:11.5px/1.5 Consolas,monospace;color:var(--ink);max-height:220px;overflow:auto}
  .badge{display:inline-block;padding:1px 7px;border-radius:7px;font-size:9px;letter-spacing:1px;border:1px solid var(--edge)}
  .badge.draft{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 50%,transparent)}
  .badge.on{color:var(--green);border-color:color-mix(in srgb,var(--green) 50%,transparent)}
  .rowb{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .btn-go{border:none;border-radius:10px;padding:8px 14px;font:inherit;font-weight:700;font-size:12px;cursor:pointer;color:#04121a;background:var(--green)}
  .btn-go:disabled{opacity:.45;cursor:default}
  .err{color:var(--red)}
  select.ghost{max-width:200px}
  /* ---- editor de video (pestaña Video) ---- */
  .pane.scroll{overflow:auto;padding-right:4px}
  .pane.scroll .cols{flex:none;min-height:260px}
  .ed{flex:none;--c:var(--violet)}
  .ed .edtop{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .ed .edtop select,.ed .edtop input{background:rgba(8,11,20,.7);border:1px solid var(--edge);color:var(--ink);border-radius:9px;font:inherit;font-size:12px;padding:5px 8px}
  .ed .edtop .sp{flex:1}
  .ed .edst{font-size:10.5px;color:var(--muted)} .ed .edst b{color:var(--ink)} .ed .edst .ia{color:var(--cyan)} .ed .edst .us{color:var(--green)}
  .ed .edmain{display:grid;grid-template-columns:minmax(260px,1.1fr) minmax(240px,1fr) minmax(150px,.55fr);gap:10px;min-height:0}
  .ed .edbox{background:rgba(8,11,20,.55);border:1px solid var(--edge);border-radius:12px;padding:8px;min-width:0}
  .ed video{width:100%;max-height:230px;background:#000;border-radius:8px;display:block}
  .ed .stage{position:relative;width:100%;max-height:230px;background:#000;border-radius:8px;overflow:hidden;margin:0 auto}
  .ed .stage video{position:absolute;inset:0;width:100%;height:100%;max-height:none;object-fit:contain;border-radius:0}
  .ed .ovl{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .ed .ovi{position:absolute;pointer-events:auto;cursor:move;touch-action:none;outline:1px dashed rgba(255,255,255,.35)}
  .ed .ovi.sel{outline:2px solid var(--amber)} .ed .ovi img,.ed .ovi video{width:100%;height:auto;display:block;pointer-events:none;position:static}
  .ed .ovi .rs{position:absolute;right:-6px;bottom:-6px;width:12px;height:12px;border-radius:3px;background:var(--amber);cursor:nwse-resize}
  .ed .trn{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 3px,transparent 3px 6px);pointer-events:none}
  .ed .bin .it .fx{float:right;margin-left:6px;opacity:.75;cursor:pointer} .ed .bin .it .fx:hover{opacity:1}
  .ed .edprev{font-size:10.5px;color:var(--muted);margin-top:5px;line-height:1.5}
  .ed .insp{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center;font-size:11.5px;max-height:262px;overflow:auto}
  .ed .insp label{color:var(--muted)} .ed .insp input,.ed .insp select{width:100%;background:rgba(8,11,20,.8);border:1px solid var(--edge);color:var(--ink);border-radius:7px;font:inherit;font-size:11.5px;padding:3px 6px}
  .ed .insp h4{grid-column:1/-1;margin:0 0 3px;font-size:11px;letter-spacing:1px;color:var(--c)}
  .ed .bin{display:flex;flex-direction:column;gap:3px;max-height:262px;overflow:auto;font-size:11.5px}
  .ed .bin .it{padding:4px 7px;border-radius:7px;background:rgba(255,255,255,.04);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ed .bin .it:hover{background:color-mix(in srgb,var(--c) 22%,transparent)}
  .ed .tl{position:relative;overflow-x:auto;overflow-y:hidden;border:1px solid var(--edge);border-radius:12px;background:rgba(8,11,20,.55);user-select:none}
  .ed .tlin{position:relative;min-height:150px}
  .ed .ruler{position:relative;height:20px;border-bottom:1px solid var(--edge);cursor:pointer}
  .ed .ruler i{position:absolute;top:0;bottom:0;border-left:1px solid rgba(255,255,255,.14);font-style:normal;font-size:9px;color:var(--muted);padding-left:3px}
  .ed .trk{position:relative;height:38px;border-bottom:1px dashed rgba(255,255,255,.07)}
  .ed .trk .lb{position:sticky;left:0;z-index:3;display:inline-block;width:30px;height:100%;background:rgba(8,11,20,.92);font-size:10px;color:var(--muted);line-height:38px;text-align:center}
  .ed .clip{position:absolute;top:4px;height:30px;border-radius:7px;font-size:10.5px;line-height:30px;padding:0 8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:grab;
    background:color-mix(in srgb,var(--cc) 35%,transparent);border:1px solid color-mix(in srgb,var(--cc) 75%,transparent)}
  .ed .clip.sel{outline:2px solid #fff;z-index:2}
  .ed .clip .h{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize;background:rgba(255,255,255,.28)}
  .ed .clip .h.l{left:0} .ed .clip .h.r{right:0}
  .ed .play{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:4;pointer-events:none}
  .ed .msg{font-size:11px;min-height:15px} .ed .msg.bad{color:var(--red)} .ed .msg.ok{color:var(--green)}
  .ed .mini{background:rgba(255,255,255,.05);border:1px solid var(--edge);color:var(--ink);border-radius:8px;font:inherit;font-size:11.5px;padding:4px 9px;cursor:pointer}
  .ed .mini:disabled{opacity:.4;cursor:default}
</style>

<div class="app">
  <div class="head">
    <div class="orb"></div>
    <div><h1 id="marca">RAPHAEL · ORQUESTADOR</h1><p>UN PEDIDO → LA BRIGADA QUE CORRESPONDE</p></div>
    <div class="modelo" id="orqmodelo" title="Modelo efectivo del orquestador (ruteo + diseñador de brigadas)">MODELO DEL ORQUESTADOR<br><b>cargando…</b></div>
    <button class="chip" id="vozchip" title="Leer las respuestas en voz alta (voz local es-AR, en esta PC)">🔊 Leer respuestas: <b>OFF</b></button>
    <button class="chip" id="procchip" title="Mostrar u ocultar los pasos intermedios (ruteo, plan, ayudantes, reporte). Oculto: solo ves la respuesta.">👁 Proceso: <b>visible</b></button>
    <button class="chip" id="vivochip" title="Efímeros corriendo ahora en todas las brigadas: abrir el tablero">⚡ <b>0</b> efímeros en vivo</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="panes" id="panes"></div>
</div>

<script>
const TOKEN = "__TOKEN__";
const AUTH = {Authorization: "Bearer " + TOKEN};
const $ = (r, s) => r.querySelector(s);
const esc = s => (s==null?"":String(s)).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// Pestañas: el orquestador (auto-ruteo) + una por brigada. `brigade` = id en el registro de jefes.
// Las "soon" son las de la Suite que todavía no tienen jefe (mismo molde, próximamente).
const TABS = [
  {id:"orq",           name:"Orquestador",    sub:"AUTO-RUTEO",     icon:"🧭", color:"var(--cyan)"},
  {id:"cerebro",       name:"Cerebro",        sub:"NÚCLEO · MEMORIA", icon:"🧠", color:"var(--pink)", brigade:"cerebro"},
  {id:"investigacion", name:"Investigación",  sub:"SCOUT · FORENSE",icon:"🔬", color:"var(--teal)", brigade:"investigacion"},
  {id:"video",         name:"Video",          sub:"EDICIÓN · REDES", icon:"🎬", color:"var(--violet)", brigade:"video"},
  {id:"brigadas",      name:"Brigadas",       sub:"CREAR · ACTIVAR", icon:"🧩", color:"var(--amber)", mgmt:true},
  {id:"vivo",          name:"Efímeros",       sub:"EN VIVO",         icon:"⚡", color:"var(--orange)", live:true},
  {sep:true},
  {id:"seg",     name:"Seguridad",       sub:"PRÓXIMAMENTE", icon:"🛡️", color:"var(--blue)",   soon:true},
  {id:"anti",    name:"Antimalware",     sub:"PRÓXIMAMENTE", icon:"🦠", color:"var(--green)",  soon:true},
  {id:"repair",  name:"Autorreparación", sub:"PRÓXIMAMENTE", icon:"🔧", color:"var(--violet)", soon:true},
  {id:"ops",     name:"Operaciones",     sub:"PRÓXIMAMENTE", icon:"⚙️", color:"var(--teal)",   soon:true},
  {id:"geo",     name:"Geolocalización", sub:"PRÓXIMAMENTE", icon:"🌐", color:"var(--blue)",   soon:true},
  {id:"trade",   name:"Trading",         sub:"PRÓXIMAMENTE", icon:"📈", color:"var(--amber)",  soon:true},
  {id:"ingest",  name:"Ingesta",         sub:"PRÓXIMAMENTE", icon:"📥", color:"var(--orange)", soon:true},
  {id:"content", name:"Contenido",       sub:"PRÓXIMAMENTE", icon:"🎬", color:"var(--violet)", soon:true},
];
const LABEL = {
  research_topic:"buscando en la web", obsidian_save_note:"guardando nota", obsidian_search_notes:"buscando en tus notas",
  obsidian_buscar_asociativo:"recorriendo tus notas por asociación", obsidian_list_notes:"listando notas",
  fs_read_file:"leyendo archivo", fs_write_file:"escribiendo archivo", fs_list_dir:"mirando carpeta", fs_create_dir:"creando carpeta",
  investigation_create_case:"creando caso", investigation_ingest_csv:"ingestando CSV",
  investigation_ingest_whatsapp_export:"ingestando WhatsApp", investigation_ingest_telegram_export:"ingestando Telegram",
  investigation_ingest_image:"leyendo EXIF", investigation_ingest_document:"ingestando documento",
  investigation_propose_entities:"proponiendo entidades", investigation_propose_fusion:"proponiendo fusión",
  investigation_export_report:"exportando informe",
};
const VIA = {override:"elegida a mano", reglas:"reglas", llm:"modelo del orquestador", default:"por defecto", comando:"comando", charla:"respuesta directa", conjunto:"trabajo conjunto", sistema:"sobre Raphael"};
const BICON = {cerebro:"🧠", investigacion:"🔬", video:"🎬", orq:"🧭"};
const ORQ_HELP = `En «Automático» el orquestador decide la brigada: lo que suena a <b>notas / memoria</b> va a <b>Cerebro</b>;
  <b>investigar en la web</b> o <b>evidencia de un caso</b> va a <b>Investigación</b> (que delega en Scout o Forense).
  Al principio de cada respuesta ves a cuál fue y por qué. Para forzar una brigada escribí <code>/cerebro …</code> o <code>/investigacion …</code>,
  o abrí su pestaña y hablale directo.<br><br>
  <b>Brigadas nuevas:</b> <code>/crear-brigada &lt;descripción&gt;</code> arma un <b>borrador</b> (no funciona todavía); lo revisás y recién lo activás con
  <code>/activar-brigada &lt;id&gt; &lt;hash&gt;</code> o desde la pestaña «Brigadas». Una brigada creada se usa con <code>/&lt;id&gt; …</code> o desde su pestaña.`;

const panes = {};     // id -> {el, busy}
let meta = {};        // id de brigada -> {name, model, tools}

// ---------- pestañas ----------
const tabsEl = document.getElementById("tabs");
function renderTabs(activeId){
  tabsEl.innerHTML = "";
  TABS.forEach(t => {
    if(t.sep){ const s = document.createElement("div"); s.className = "sep"; tabsEl.appendChild(s); return; }
    const b = document.createElement("button");
    b.className = "tab" + (t.soon ? " soon" : "") + (t.id === activeId ? " on" : ""); b.dataset.id = t.id; b.style.setProperty("--c", t.color);
    // el nombre de una brigada CREADA viene de un borrador: siempre escapado
    b.innerHTML = `<span class="ti">${t.icon}</span><span class="tt">${esc(t.name)}<span class="ts">${esc(t.sub)}</span></span>`;
    b.onclick = () => select(t.id);
    tabsEl.appendChild(b);
  });
}
renderTabs(null);

function select(id){
  const t = TABS.find(x => x.id === id) || TABS[0];
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.id === t.id));
  document.querySelectorAll(".pane").forEach(p => p.classList.remove("on"));
  if(!panes[t.id]) panes[t.id] = buildPane(t);
  panes[t.id].el.classList.add("on");
  try{ sessionStorage.setItem("tab", t.id); }catch{}
  if(!t.soon){ refreshSide(t); const i = $(panes[t.id].el, "input"); if(i) i.focus(); }
  else if(t.id === "seg") refreshCocineros(panes[t.id], "seguridad");  // la pestaña es "seg"; la brigada, "seguridad"
}

// ---------- editor de video: el MISMO proyecto que edita la IA (tools video_proyecto_*) ----------
const ED_COLOR = {V1:"var(--violet)", A1:"var(--green)", T1:"var(--amber)", O1:"var(--pink)", A2:"var(--blue)"};
const ED_PISTAS = ["T1","O1","V1","A1","A2"];
const ED_IMG = /\.(png|jpe?g|webp|gif)$/i;
const ED_AUDIO = /\.(mp3|wav|m4a|aac|ogg|flac)$/i;
function buildEditor(host){
  const S = {proj:null, id:null, sel:null, t:0, pps:60, previewRev:null, previewFile:null, drag:null, busy:false};
  host.innerHTML = `

  async function jget(path){ const r = await api(path); const j = await r.json(); if(!r.ok) throw new Error(j.detail || ("HTTP " + r.status)); return j; }

  async function lista(elegir){

  async function medios(){

        const n = typeof f === "string" ? f : f.archivo, au = ED_AUDIO.test(n), im = ED_IMG.test(n);

        const ex = au && carp !== "efectos" ? '<span class="fx" data-m="fx" title="Como efecto de sonido (pista A2)">🔊</span>' : (!au && !im ? '<span class="fx" data-m="capa" title="Como capa superpuesta (pista O1)">▣</span>' : "");

  }

  function status(){
    const p = S.proj, el = $e("#edSt");

    const u = p.ultimo_cambio || {};
    el.innerHTML = `<b>${esc(p.nombre)}</b> · ${p.formato} ${p.ancho}×${p.alto} · ${num(p.duracion)} s · rev ${p.rev} · último cambio: <span class="${u.por === "ia" ? "ia" : "us"}">${esc(u.por || "—")}</span> ${esc(u.resumen || "")}`;

    const dur = Math.max(p.duracion, 10) + 4, ancho = 40 + dur * S.pps; tl.style.width = ancho + "px";

        const etq = k === "T1" ? "T: " + c.texto : (k === "O1" ? ({imagen:"🖼",gif:"✨",video:"🎬"}[c.tipo]||"") + " " : "") + c.archivo, w = Math.max(14, c.dur * S.pps);
        h += `<div class="clip ${c.id === S.sel ? "sel" : ""}" data-id="${esc(c.id)}" data-k="${k}" style="--cc:${ED_COLOR[k]};left:${40 + c.pos*S.pps}px;width:${w}px" title="${esc(c.id)} · ${esc(etq)} · ${num(c.dur)} s">`
           + (c.tdur > 0 ? `<span class="trn" style="width:${c.tdur*S.pps}px" title="transición: ${esc(c.transicion)}"></span>` : "") + '<span class="h l"></span>' + esc(c.id + " · " + etq) + '<span class="h r"></span></div>';

  // Capas sobre el reproductor: se ven y se arrastran (mover = x,y; esquina = escala). Con la vista previa renderizada ya vienen "horneadas", así que se ocultan.
  function capas(vigente){

    const ar = p.ancho / p.alto, h = 230, w = Math.min(host.clientWidth * .3, h * ar);

  function arrastreCapa(ev, el){
    ev.preventDefault(); ev.stopPropagation(); const id = el.dataset.id, c = clipsDe(S.proj, "O1").find(x => x.id === id); if(!c) return;
    const st = $e("#edStage").getBoundingClientRect(), esc_ = ev.target.classList.contains("rs");

    host.querySelectorAll(".ovi").forEach(x => x.classList.toggle("sel", x === el));

      if(esc_){ ne = Math.min(1, Math.max(.05, 2 * Math.abs(e.clientX - (st.left + c.x * st.width)) / st.width)); el.style.width = ne * 100 + "%"; }
      else { nx = Math.min(1, Math.max(0, (e.clientX - st.left) / st.width)); ny = Math.min(1, Math.max(0, (e.clientY - st.top) / st.height)); el.style.left = nx * 100 + "%"; el.style.top = ny * 100 + "%"; } };

  function previa(){

  // Arrastrar: el cuerpo mueve (V1 = cambia de orden, A1/T1 = cambia de posición); los bordes recortan. Se aplica UNA operación al soltar.
  function arrastre(ev, el){
    ev.preventDefault(); const id = el.dataset.id, k = el.dataset.k, c = todos(S.proj).find(x => x.id === id); if(!c) return;
    S.sel = id; host.querySelectorAll(".clip").forEach(x => x.classList.toggle("sel", x === el)); inspector(); previa();   // sin redibujar: el clip que se arrastra tiene que seguir en el DOM
    const borde = ev.target.classList.contains("h") ? (ev.target.classList.contains("l") ? "l" : "r") : null;

    el.onpointercancel = () => { el.onpointermove = el.onpointerup = el.onpointercancel = null; S.drag = false; draw(); };
    el.onpointerup = async e => {
      el.onpointermove = el.onpointerup = el.onpointercancel = null; S.drag = false; const ds = dx / S.pps;
      if(Math.abs(dx) < 3){ mover(S.t); draw(); return; }                       // click: solo elegir
      const vel = c.velocidad || 1;
      if(borde === "r"){
        if(k === "T1" || (k === "O1" && c.tipo !== "video")) return ops([{op:"ajustar", clip:id, dur:num(Math.max(.2, c.dur + ds))}]);

      if(borde === "l"){
        if(k === "T1" || (k === "O1" && c.tipo !== "video")) return ops([{op:"ajustar", clip:id, pos:num(Math.max(0, c.pos + ds)), dur:num(Math.max(.2, c.dur - ds))}]);
        const lista = [{op:"recortar", clip:id, inicio:num(Math.max(0, c.inicio + ds * vel))}];

        return ops(lista);

  async function render(calidad){
    if(!S.id) return msg("Primero creá o elegí un proyecto.", "bad"); if(S.busy) return;
    S.busy = true; $e("#edPrev").disabled = $e("#edFinal").disabled = true; msg(calidad === "preview" ? "Generando la vista previa…" : "Renderizando el video final (puede tardar)…");
    const rev = S.proj.rev;
    try{
      const j = await jpost(`/api/video/proyectos/${S.id}/render`, {calidad});
      if(calidad === "preview"){ S.previewFile = j.archivo; S.previewRev = rev; const v = $e("#edVid"), url = `/api/video/media/${encodeURIComponent(j.archivo)}?tk=${encodeURIComponent(TOKEN)}`;
        v.dataset.src = url; v.src = url; v.onloadedmetadata = () => { v.currentTime = S.t; }; v.play().catch(() => {}); msg("Vista previa lista.", "ok"); previa(); }
      else { msg(`Listo: ${j.archivo} (en la carpeta salida/ de Videos-Raphael)`, "ok"); medios(); }
    }catch(e){ msg(e.message, "bad"); }
    S.busy = false; $e("#edPrev").disabled = $e("#edFinal").disabled = false;
  }
  $e("#edPrev").onclick = () => render("preview"); $e("#edFinal").onclick = () => render("final");
  $e("#edVid").ontimeupdate = () => { const p = S.proj; if(p && S.previewFile && S.previewRev === p.rev && !S.drag){ S.t = $e("#edVid").currentTime; const pl = $e("#edPlay"); if(pl) pl.style.left = (40 + S.t*S.pps) + "px"; } };

  // ---- la IA cambia el proyecto: se ve al toque (consulta cada 2 s mientras la pestaña está abierta) ----
  setInterval(async () => {
    if(document.hidden || S.drag || S.busy || !S.id || !host.closest(".pane.on")) return;
    try{ const p = await jget(`/api/video/proyectos/${S.id}`);
      if(S.proj && p.rev !== S.proj.rev){ const ia = p.ultimo_cambio && p.ultimo_cambio.por === "ia"; setProj(p); if(ia) msg("La IA cambió el proyecto: " + (p.ultimo_cambio.resumen || ""), "ok"); }
    }catch(e){}
  }, 2000);
  lista(); medios();
  return {S, lista, medios, ops, abierto: () => S.proj ? {id:S.id, rev:S.proj.rev, clip:S.sel, tiempo:num(S.t)} : null};
}

// ---------- pane ----------
function buildPane(t){
  const el = document.createElement("div"); el.className = "pane"; el.style.setProperty("--c", t.color);
  document.getElementById("panes").appendChild(el);
  if(t.mgmt) return buildBrigadasPane(t, el);
  if(t.live) return buildVivoPane(t, el);
  if(t.soon){
    el.innerHTML = `<div class="soonview"><div><div class="big">${t.icon}</div><h2>${esc(t.name)}</h2>
      <p>Esta brigada se arma con el mismo molde que Cerebro e Investigación.<br>Próximamente.</p>
      ${t.id === "seg" ? '<div class="card" style="--c:var(--pink);text-align:left;margin-top:14px;min-width:340px"><h3>COCINEROS · PERMANENTES</h3><div class="list" id="cocineros"><div class="empty">—</div></div></div>' : ""}</div></div>`;
    return {el, busy:false};
  }
  const orq = !t.brigade;
  let sideHtml = t.id === "cerebro" ? `
      <div class="side">
        <div class="card" id="dirCard" style="display:none;--c:var(--amber)">
          <h3>DIRECTRICES DE CEREBRO <span class="r" id="dirStatus"></span></h3>
          <textarea class="dir" id="dirText"></textarea>
          <div style="display:flex;justify-content:flex-end"><button class="ghost" id="dirSave">Guardar directrices</button></div>
        </div>
        <div class="card grow" style="--c:var(--green)">
          <h3>LO QUE HIZO SOLO <button class="r" data-act="refresh" title="Actualizar">↻</button></h3>
          <div class="list" id="activity"><div class="empty">—</div></div>
        </div>
      </div>` : t.id === "investigacion" ? `
      <div class="side">
        <div class="card" style="--c:var(--blue)"><h3>AYUDANTES</h3><div class="list" id="helpers"><div class="empty">—</div></div></div>
        <div class="card grow" style="--c:var(--violet)">
          <h3>NOTAS CAPTURADAS <button class="r" data-act="refresh" title="Actualizar">↻</button></h3>
          <div class="list" id="notes"><div class="empty">—</div></div>
        </div>
      </div>` : "";
  // Panel COCINEROS (agentes permanentes de la brigada) en la vista de CADA brigada, sale del spec (/api/cocineros).
  const cookCard = '<div class="card" style="--c:var(--pink)"><h3>COCINEROS · PERMANENTES <button class="r" data-act="refresh" title="Actualizar">↻</button></h3>'
    + '<div class="list" id="cocineros" style="flex:none;max-height:240px"><div class="empty">—</div></div></div>';
  if(!orq){
    if(sideHtml) sideHtml = sideHtml.replace('<div class="side">', '<div class="side">' + cookCard);
    else sideHtml = '<div class="side">' + cookCard + '</div>';
  }
  const placeholder = orq ? "Escribí un pedido y el orquestador elige la brigada" :
    t.created ? "Hablale directo a esta brigada" :
    t.id === "cerebro" ? "¿Qué sé de...? (algo de tus notas)" : "Investigar en la web (Scout) o trabajar evidencia de un caso (Forense)";
  el.innerHTML = `
    <div class="phead"><div class="pic">${t.icon}</div>
      <div><h2>${esc(t.name)}</h2><p class="sub">${esc(t.sub)}</p></div>
      ${t.id === "cerebro" ? '<button class="ghost" id="dirBtn" style="margin-left:auto">✎ Directrices</button>' : ""}
      <div class="meta" id="meta" style="${t.id === "cerebro" ? "" : "margin-left:auto"}">${orq ? "" : "cargando…"}</div></div>
    <div class="ask"><input autocomplete="off" placeholder="${esc(placeholder)}"><button>Enviar</button><button class="mic" type="button" title="Hablar: graba tu voz y la transcribe en esta PC (local)">🎙</button></div>
    <div class="cols ${sideHtml ? "two" : ""}">
      <div class="card grow">
        <h3>${orq ? "FEED" : "RESPUESTA"} <span class="live"><i></i>TRABAJANDO</span><button class="r" data-act="clear">limpiar</button></h3>
        <div class="feed"><div class="empty">${orq ? ORQ_HELP : "Hablale directo a esta brigada: acá ves cada paso y la respuesta."}</div></div>
      </div>${sideHtml}
    </div>`;
  const p = {el, busy:false, tab:t};
  if(t.id === "video"){  // editor de video: se inserta entre la barra de pedido y las columnas
    el.classList.add("scroll");
    const card = document.createElement("div"); card.className = "card ed"; el.insertBefore(card, $(el, ".cols"));
    p.editor = buildEditor(card);
  }
  const send = () => ask(p);
  $(el, ".ask button").onclick = send;
  const mic = $(el, ".ask .mic"); if(mic) mic.onclick = () => toggleMic(p);
  $(el, ".ask input").addEventListener("keydown", e => { if(e.key === "Enter") send(); });
  const clr = $(el, '[data-act="clear"]'); if(clr) clr.onclick = () => { $(el, ".feed").innerHTML = ""; };
  const rf = $(el, '[data-act="refresh"]'); if(rf) rf.onclick = () => refreshSide(t);
  if(t.id === "cerebro"){ $(el, "#dirBtn").onclick = () => toggleDir(p); $(el, "#dirSave").onclick = () => saveDir(p); }
  renderMeta(p);
  return p;
}

// El nombre del asistente sale de la config (IDENTIDAD_ASISTENTE): la UI no lo lleva escrito.
function pintarMarca(nombre){
  if(!nombre) return;
  const h = document.getElementById("marca"); if(h) h.textContent = String(nombre).toUpperCase() + " · ORQUESTADOR";
  document.title = nombre + " — Orquestador";
}
function renderMeta(p){
  const t = p.tab, el = $(p.el, "#meta"); if(!el || !t) return;
  if(!t.brigade){  // pestaña del orquestador: su propio modelo
    el.innerHTML = ORQ ? `modelo del orquestador<br><b>${esc(ORQ.label)}</b>` : ""; return;
  }
  const m = meta[t.brigade];
  if(!m){ el.innerHTML = '<span class="warn">sin datos</span>'; return; }
  if(m.error){ el.innerHTML = `<span class="warn">${esc(m.error)}</span>`; return; }
  // Modelo EFECTIVO de cada rol de la brigada (cada uno tiene el suyo, intercambiable por config): jefe + ayudantes.
  const r = m.roles;
  const lineas = r ? [`jefe: <b>${esc(r.jefe.modelo)}</b>`, ...(r.ayudantes||[]).map(a => `${esc(a.modo)}: <b>${esc(a.modelo)}</b>`)]
                   : [`<b>${esc(m.model_label || m.model || "")}</b>`];
  el.innerHTML = `${lineas.join("<br>")}<br>${m.tools} skills · persistente`;
}

async function api(path, opts){
  const r = await fetch(path, {...(opts||{}), headers:{...AUTH, ...((opts&&opts.headers)||{})}});
  if(r.status === 401 && staleToken()) throw new Error("recargando");
  return r;
}
// Si el orquestador se reinició con la ventana abierta, el token quedó viejo: se recarga UNA vez.
function staleToken(){
  if(sessionStorage.getItem("reloaded")) return false;
  sessionStorage.setItem("reloaded", "1"); location.reload(); return true;
}

async function loadMeta(){
  try{
    const r = await api("/api/meta"); if(!r.ok) throw 0;
    sessionStorage.removeItem("reloaded");
    const j = await r.json();
    meta = Object.fromEntries(j.brigades.map(b => [b.id, b]));
    ORQ = j.orquestador || null;
    VOZMODELO = j.voz || null;
    pintarMarca(j.asistente);
  }catch{ meta = {}; }
  const om = document.getElementById("orqmodelo");
  if(om) om.innerHTML = ORQ ? `MODELO DEL ORQUESTADOR<br><b>${esc(ORQ.label)}</b>${VOZMODELO && VOZMODELO.label !== ORQ.label ? `<br>voz: <b>${esc(VOZMODELO.label)}</b>` : ""}` : "MODELO DEL ORQUESTADOR<br><b>sin datos</b>";
  Object.values(panes).forEach(p => p.tab && renderMeta(p));
}

// ---------- paneles laterales ----------
async function refreshCocineros(p, bid){
  const el = $(p.el, "#cocineros"); if(!el) return;
  try{
    const d = (await (await api("/api/cocineros")).json()).brigadas || {};
    const b = d[bid];
    if(!b){ el.innerHTML = '<div class="empty">Sin datos de esta brigada.</div>'; return; }
    el.innerHTML = (b.cocineros||[]).map(c => `<div class="note cook">
        <div class="nt">🧑‍🍳 ${esc(c.nombre)} <small style="font-weight:400;color:var(--muted)">· ${esc(c.rol)}${c.memoria ? " · memoria persistente" : ""}</small></div>
        <div class="nm">${esc(c.detalle)}<br>modelo: <b style="color:var(--cyan)">${esc(c.modelo)}</b> · ${c.tools} tools</div></div>`).join("")
      || '<div class="empty">Esta brigada no tiene agentes permanentes.</div>';
    if((b.efimeros||[]).length)
      el.innerHTML += `<div class="empty">Efímeros que puede crear (nacen por tarea y mueren): ${(b.efimeros||[]).map(e => `<b>${esc(e.modo)}</b> <small>${esc(e.modelo)}</small>`).join(" · ")}</div>`;
  }catch{ el.innerHTML = '<div class="empty">No se pudo leer.</div>'; }
}

async function refreshSide(t){
  const p = panes[t.id]; if(!p) return;
  if(t.brigade) refreshCocineros(p, t.brigade);
  try{
    if(t.id === "cerebro"){
      const d = await (await api("/api/cerebro/activity?limit=30")).json();
      const ICON = {reindex:"🔄", consolidacion:"🌙", conclusion:"💡", info:"·"};
      $(p.el, "#activity").innerHTML = (d.items||[]).map(it => `<div class="note"><div class="nt" style="font-weight:500">${ICON[it.action]||"·"} ${esc(it.detail)}</div></div>`).join("")
        || '<div class="empty">Todavía no trabajó solo. (Se activa con CEREBRO_PROACTIVE_ENABLED en el Raphael completo.)</div>';
    } else if(t.mgmt){
      refreshBrigadas(p);
    } else if(t.id === "investigacion"){
      const s = await (await api("/api/investigacion/skills")).json();
      $(p.el, "#helpers").innerHTML = (s.skills||[]).map(x => `<div class="note">
        <div class="nt">${x.modo === "forense" ? "🔬 Forense" : "🔭 Scout"} <small style="font-weight:400;color:var(--muted)">· efímero · ${x.tools.length} tools</small></div>
        <div class="nm">${esc(x.descripcion)}<br>corre en: ${esc(x.modelo)}</div></div>`).join("");
      const n = await (await api("/api/investigacion/notes?limit=30")).json();
      $(p.el, "#notes").innerHTML = (n.notes||[]).map(x => `<div class="note"><div class="nt">${esc(x.title)}</div>
        <div class="nm">${esc((x.created||"").slice(0,10))}${(x.tags||[]).slice(0,3).map(g => `<span class="tag">${esc(g)}</span>`).join("")}</div></div>`).join("")
        || '<div class="empty">Todavía no hay notas capturadas.</div>';
    }
  }catch{ /* un panel lateral caído no rompe el chat */ }
}

async function toggleDir(p){
  const card = $(p.el, "#dirCard");
  if(card.style.display === "none"){
    card.style.display = "flex";
    try{ $(p.el, "#dirText").value = (await (await api("/api/cerebro/directrices")).json()).text || ""; }catch{}

async function saveDir(p){

// ---------- chat ----------
function add(feed, cls, mk, html){
  const e = document.createElement("div");
  e.className = "ev " + cls; e.innerHTML = `<div class="mk">${mk}</div><div class="tx">${html}</div>`;
  feed.appendChild(e); feed.scrollTop = feed.scrollHeight;
}
// "Connection error." casi siempre es el modelo local (Ollama) apagado: se lo decimos.
let ORQ = null;      // modelo efectivo del orquestador: {label, provider, ...}
let VOZMODELO = null;      // modelo efectivo de la VOZ del orquestador (el que redacta el mensaje final)
const hint = t => /connection error/i.test(t||"") ? ` — no se pudo hablar con el modelo (${ORQ ? ORQ.label : "ver .env"}): revisá la key del proveedor y la conexión.` : "";
const HICON = {scout:"🔭", forense:"🔬", recuperador:"🧠", escaneo:"📡", reporte:"📄"};
const VIAPLAN = {"reglas":"por reglas", "llm":"lo planificó el jefe", "reglas (respaldo)":"por reglas (sin plan del modelo)"};
const VIAVOZ = {"llm":"", "llm+fuentes":" · fuentes completadas por código", "llm+directriz":" · abreviado por tus directrices", "plantilla":" · mensaje de respaldo por plantilla"};
// El reporte interno del jefe (fuente de verdad del mensaje): inspeccionable, TODO escapado.
function reporteHtml(r){
  if(!r) return "";
  const li = xs => xs.map(x => `<div class="nm">${x}</div>`).join("");
  const partes = [`<div class="nm"><b>${esc(r.resumen||"")}</b></div>`,
    li((r.hallazgos||[]).map(h => `• ${esc(h.texto)} <small>${esc(h.ayudante||"")}${(h.fuentes||[]).length ? " · " + esc(h.fuentes.join("; ")) : ""}</small>`)),
    (r.fuentes||[]).length ? `<div class="nm">Fuentes: ${r.fuentes.map(f => esc(f.titulo || f.ref)).join("; ")}</div>` : "",
    (r.artefactos||[]).length ? `<div class="nm">Creado: ${r.artefactos.map(a => esc(a.tipo + " " + a.ref)).join("; ")}</div>` : "",
    (r.no_encontrado||[]).length ? `<div class="nm">No encontrado: ${r.no_encontrado.map(esc).join("; ")}</div>` : "",
    li((r.propuestas_pendientes||[]).map(x => `<span class="warn">⚠ PROPUESTA (requiere tu aprobación)</span> <code>${esc(x.id)}</code> — ${esc(x.descripcion)}`)),
    li((r.fallos||[]).map(f => `<span class="err">✗ ${esc(f.ayudante)} (${esc(f.motivo)})</span> ${esc(f.detalle)}`)),
    li((r.avisos||[]).map(a => `<span class="warn">⚠ ${esc(a)}</span>`)),
    `<details><summary class="nm" style="cursor:pointer">reporte completo (JSON)</summary><pre class="pp">${esc(JSON.stringify(r, null, 1))}</pre></details>`];
  return partes.join("");
}

// Pasos intermedios: se pueden ocultar con el chip "Proceso". Nunca se ocultan la respuesta, un error ni un corte del watchdog.
let verProceso = true; try{ verProceso = localStorage.getItem("proceso") !== "0"; }catch{}
function pintarProceso(){
  document.body.classList.toggle("sin-proceso", !verProceso);
  const chip = document.getElementById("procchip");
  if(chip){ chip.classList.toggle("hot", !verProceso); chip.innerHTML = `👁 Proceso: <b>${verProceso ? "visible" : "oculto"}</b>`; }
  document.querySelectorAll(".feed").forEach(f => { f.scrollTop = f.scrollHeight; });
}
document.getElementById("procchip").onclick = () => {
  verProceso = !verProceso; try{ localStorage.setItem("proceso", verProceso ? "1" : "0"); }catch{}
  pintarProceso();
};
pintarProceso();
const esPaso = ev => !(ev.type === "final" || ev.type === "error" || (ev.type === "watchdog" && ev.action === "cut"));

function onEvent(p, ev){
  const feed = $(p.el, ".feed");
  const antes = feed.children.length;
  if(ev.type === "route") p.conjunto = ev.via === "conjunto";
  pintarEvento(p, ev);
  if(esPaso(ev)) for(let i = antes; i < feed.children.length; i++) feed.children[i].classList.add("paso");
  // trabajo conjunto: cada paso dice de qué brigada es (el id viene del registro; va escapado igual)
  if(p.conjunto && ev.brigada && ev.type !== "route" && ev.type !== "final") for(let i = antes; i < feed.children.length; i++){
    const tx = feed.children[i].querySelector(".tx");
    if(tx) tx.insertAdjacentHTML("afterbegin", `<small>[${ev.conjunto ? "🧭 todas" : (BICON[ev.brigada] || "🧩") + " " + esc(ev.brigada)}]</small> `);
  }
}
function pintarEvento(p, ev){
  const feed = $(p.el, ".feed"), name = ev.name || "";
  if(ev.type === "route"){
    if(p.tab.brigade) return;  // en la pestaña de una brigada el destino ya está elegido
    add(feed, "route", "🧭", `Ruteó a <b>${BICON[ev.brigade] || "🧩"} ${esc(ev.name)}</b> <small>· ${esc(VIA[ev.via]||ev.via)} — ${esc(ev.reason)}</small>`);
  } else if(ev.type === "plan"){
    const ds = (ev.delegaciones||[]).map(d => `<b>${esc(d.modo)}</b>`).join(ev.paralelo ? " + " : " → ");
    add(feed, "route", "🗺", `El jefe planificó: ${ds} <small>· ${esc(VIAPLAN[ev.via]||ev.via)}${ev.paralelo ? " · en paralelo" : ""} — ${esc(ev.motivo||"")}</small>`);
  } else if(ev.type === "delegacion"){
    add(feed, "run", HICON[ev.modo] || "⚡", `Delegó en el ayudante <b>${esc(ev.modo)}</b> <small>${esc(ev.modelo||"")} · ${esc(ev.tarea||"")}</small>`);
  } else if((ev.type === "tool" || ev.type === "tool_result") && name.startsWith("delegar:")){
    /* compat: la delegación y su resultado ya se muestran con `delegacion` y `resultado_ayudante` */
  } else if(ev.type === "resultado_ayudante"){
    add(feed, ev.ok?"ok":"bad", ev.ok?"⇧":"✗", `<b>${esc(ev.ayudante)}</b> le reportó al jefe <small>· ${Number(ev.duracion_s)||0}s · ${Number(ev.fuentes)||0} fuente(s)${ev.ok ? "" : " · FALLÓ"}</small><br><small>${esc(ev.resumen||"")}</small>`);
  } else if(ev.type === "sintesis"){
    add(feed, "run", "🧑‍🍳", `El jefe sintetiza <small>${esc(ev.modelo||"")}</small>`);
  } else if(ev.type === "reporte"){
    add(feed, "route", "📋", `<b>Reporte interno</b> del jefe al orquestador <small>· confianza ${esc((ev.reporte||{}).confianza||"?")}${(ev.reporte||{}).sintesis_degradada ? " · SÍNTESIS DEGRADADA" : ""}</small>${reporteHtml(ev.reporte)}`);
  } else if(ev.type === "latido"){
    /* el motor avisa que sigue vivo esperando a un modelo: es para el watchdog, no se muestra */
  } else if(ev.type === "reparto"){
    const ts = Object.entries(ev.tareas||{}).map(([b, t]) => `<div class="nm">${BICON[b] || "🧩"} <b>${esc(b)}</b>: ${esc(t)}</div>`).join("");
    add(feed, "route", "🧭", `El orquestador repartió el pedido <small>${esc(ev.modelo||"")}${ev.via === "llm" ? "" : ev.via === "pedido" ? " · cada brigada recibe el pedido entero" : " · alguna recibe el pedido entero"} · ${(ev.niveles||[]).length > 1 ? "en cadena: " + (ev.niveles||[]).map(n => n.map(esc).join(" + ")).join(" → ") : "en paralelo"}</small>${ts}`);
  } else if(ev.type === "etapa"){
    add(feed, "route", "⛓", `<b>${esc(ev.brigada)}</b> arranca con el resultado de ${(ev.despues_de||[]).map(b => `<b>${esc(b)}</b>`).join(", ")}`);
  } else if(ev.type === "concluyendo"){
    add(feed, "run", "🧭", `El orquestador saca la conclusión <small>${esc(ev.modelo||"")}</small>`);
  } else if(ev.type === "conclusion"){
    add(feed, ev.texto ? "route" : "bad", "🧭", ev.texto ? `<b>Conclusión del orquestador</b> <small>· confianza ${esc(ev.confianza||"?")}</small><div class="nm">${esc(ev.texto)}</div>`
      : `Sin conclusión del orquestador <small>· ${esc(ev.motivo||"")}</small>`);
  } else if(ev.type === "comunicacion"){
    add(feed, "run", "🗣", `El orquestador redacta el mensaje <small>${esc(ev.modelo||"")}</small>`);
  } else if(ev.type === "start"){
    /* el pedido ya está en el encabezado del turno */
  } else if(ev.type === "tool"){
    add(feed, "run", "→", `${esc(LABEL[name]||name)} <small>${ev.ayudante ? esc(ev.ayudante) + " · " : ""}${esc(ev.args||"")}</small>`);
  } else if(ev.type === "tool_result"){
    add(feed, ev.ok?"ok":"bad", ev.ok?"✓":"✗", `<small>${esc(ev.summary||"")}</small>`);
  } else if(ev.type === "final"){
    // El `final` es SIEMPRE del orquestador: su voz (LLM), o texto de código literal (comando / gate / watchdog).
    const tt = ev.tiempos, tiempos = tt ? ` · ${Number(tt.total)||0}s (plan ${Number(tt.plan)||0} · ayudantes ${Number(tt.ayudantes)||0} · síntesis ${Number(tt.sintesis)||0} · voz ${Number(tt.voz)||0})` : "";
    const quien = ev.origen === "orquestador" ? `<br><small>orquestador${esc(ev.modelo ? " · " + ev.modelo : "")}${esc(VIAVOZ[ev.via]||"")}${ev.fidelidad && !ev.fidelidad.ok ? " · ⚠ sin verificar" : ""}${tiempos}</small>` : "";
    add(feed, "final", "✓", esc((ev.reply || "(sin texto)") + hint(ev.reply)) + quien);
    if(leer && ev.reply) hablar(ev.reply);  // "leer respuestas": la sintetiza Piper (local) y se reproduce acá
  } else if(ev.type === "watchdog"){
    add(feed, ev.action === "cut" ? "bad" : "route", "🐕", `<b>Watchdog</b> · ${esc(ev.message || "")}`);
  } else if(ev.type === "error"){
    add(feed, "bad", "✗", `Error: ${esc((ev.message||"") + hint(ev.message))}`);
  }
}

// Lo que el usuario tiene abierto en el editor (proyecto, clip elegido, cursor) viaja con el pedido: así "dividí este clip acá" se entiende.
function contextoEditor(p){
  const a = p.editor && p.editor.abierto && p.editor.abierto(); if(!a) return "";
  return `\n\n[Panel de edición abierto: proyecto "${a.id}" (rev ${a.rev})${a.clip ? ", clip elegido " + a.clip : ""}, cursor en ${a.tiempo} s. Leé el proyecto antes de cambiarlo.]`;
}
async function ask(p){
  const input = $(p.el, ".ask input"), q = input.value.trim();
  if(p.busy || !q) return;
  stopVoz();  // no hablar encima de la respuesta anterior
  p.busy = true; $(p.el, ".ask button").disabled = true; $(p.el, ".live").classList.add("on"); input.value = "";
  const feed = $(p.el, ".feed"), empty = $(feed, ".empty"); if(empty) empty.remove();
  const t = document.createElement("div"); t.className = "turn"; t.textContent = q; feed.appendChild(t);
  try{
    const resp = await api("/api/chat", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({message: q + contextoEditor(p), brigade: p.tab.brigade || null})});
    if(!resp.ok){ onEvent(p, {type:"error", message:"HTTP " + resp.status}); }
    else {
      const reader = resp.body.getReader(), dec = new TextDecoder();
      let buf = "";
      while(true){
        const {value, done} = await reader.read();
        if(done) break;
        buf += dec.decode(value, {stream:true});
        let i;
        while((i = buf.indexOf("\n")) >= 0){
          const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
          if(line){ try{ onEvent(p, JSON.parse(line)); }catch{} }
        }
      }
    }
  }catch(e){ if(String(e.message) !== "recargando") onEvent(p, {type:"error", message:String(e)}); }
  finally{
    p.busy = false; $(p.el, ".ask button").disabled = false; $(p.el, ".live").classList.remove("on"); input.focus();
    if(p.tab.id === "investigacion" || p.tab.id === "cerebro") refreshSide(p.tab);  // notas/actividad nuevas
    if(/^\s*\/(crear|activar|desactivar|descartar)-brigada\b/i.test(q)) loadBrigadas();  // un comando pudo cambiar las pestañas
  }
}

async function loadBrigadas(){
  // Las brigadas creadas y ACTIVAS aparecen como pestañas propias; un borrador NUNCA tiene pestaña.
  let d; try{ d = await (await api("/api/brigadas")).json(); }catch{ return; }
  const ids = new Set((d.activas||[]).map(b => b.id));
  for(let i = TABS.length - 1; i >= 0; i--){
    const t = TABS[i];
    if(t.created && !ids.has(t.id)){ TABS.splice(i, 1); if(panes[t.id]){ panes[t.id].el.remove(); delete panes[t.id]; } }
  }
  const at = TABS.findIndex(t => t.mgmt);
  (d.activas||[]).forEach(b => {
    if(TABS.some(t => t.id === b.id)) return;
    TABS.splice(at, 0, {id:b.id, name:b.nombre, sub:"CREADA · AYUDANTES", icon:"🧩",
                        color:"var(--violet)", brigade:b.id, created:true});
  });
  renderTabs(TABS.some(t => t.id === activeTab) ? activeTab : "orq");
  if(!TABS.some(t => t.id === activeTab)) select("orq");
  loadMeta();
}

    + `Hash del contenido: ${rv.hash_corto}\n\n¿Aprobás ESTE contenido? Quedás como responsable de lo que haga.`;

let VOZ = {enabled:false, stt:{ok:false, motivo:"cargando…"}, tts:{ok:false, motivo:"cargando…"}};
let leer = false; try{ leer = localStorage.getItem("leer") === "1"; }catch{}
let audioActual = null, rec = null;   // reproducción en curso / grabación en curso: {p, mr, chunks, stream, timer}

function pintarVoz(){
  const chip = document.getElementById("vozchip");
  if(chip){

  }

    b.disabled = !ok && !(rec && rec.p.el.contains(b));
    if(!rec) b.title = ok ? "Hablar: graba tu voz y la transcribe en esta PC (local)" : "Dictado no disponible: " + ((VOZ.stt && VOZ.stt.motivo) || "?");

async function loadVoz(){

  if(!(VOZ.tts && VOZ.tts.ok)){ alert("La lectura en voz alta no está disponible:\n" + ((VOZ.tts && VOZ.tts.motivo) || "?")); return; }
  leer = !leer; try{ localStorage.setItem("leer", leer ? "1" : "0"); }catch{}
  if(!leer) stopVoz();
  pintarVoz();
};

function stopVoz(){
  if(audioActual){ try{ audioActual.pause(); URL.revokeObjectURL(audioActual.src); }catch{} audioActual = null; }
}
// Lectura POR ORACIONES (O-10): se sintetiza y suena la primera oración mientras se van pidiendo las siguientes, así el
// primer sonido llega enseguida aunque el mensaje sea largo. Un mensaje nuevo (o "parar") corta la cola.
let turnoVoz = 0;
function oraciones(texto){
  const partes = String(texto||"").split(/(?<=[.!?…])\s+/).map(s => s.trim()).filter(Boolean), out = [];
  for(const p of partes){ if(out.length && (out[out.length-1].length < 40)) out[out.length-1] += " " + p; else out.push(p); }  // no cortar en pedacitos
  return out;
}
async function sintetizar(texto){
  const r = await api("/api/voz/hablar", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({texto})});
  return r.ok ? URL.createObjectURL(await r.blob()) : null;
}
async function hablar(texto){
  stopVoz();
  const mio = ++turnoVoz, partes = oraciones(texto);
  try{
    let siguiente = partes.length ? sintetizar(partes[0]) : null;
    for(let i = 0; i < partes.length; i++){
      const url = await siguiente;
      siguiente = i + 1 < partes.length ? sintetizar(partes[i + 1]) : null;   // la próxima se pide mientras suena esta
      if(mio !== turnoVoz) return;
      if(!url) continue;
      const a = new Audio(url); audioActual = a;
      await new Promise(res => { a.onended = a.onerror = res; a.play().catch(res); });
      URL.revokeObjectURL(url); if(audioActual === a) audioActual = null;
      if(mio !== turnoVoz) return;
    }
  }catch{ /* si el navegador bloquea el audio o falla la síntesis, el texto igual está en pantalla */ }
}

function micStatus(p, html){
  const feed = $(p.el, ".feed"); if(!feed) return;
  const empty = $(feed, ".empty"); if(empty) empty.remove();
  add(feed, "route", "🎙", html);
}
async function toggleMic(p){
  const btn = $(p.el, ".ask .mic");
  if(rec){ if(rec.p === p) rec.mr.stop(); return; }   // segundo clic: termina y transcribe
  stopVoz();
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ micStatus(p, `No pude usar el micrófono: ${esc(e.name || e)}. Dale permiso al micrófono a esta ventana.`); return; }
  const mime = ["audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus"].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
  const mr = new MediaRecorder(stream, mime ? {mimeType:mime} : {}), chunks = [];
  rec = {p, mr, chunks, stream, timer: setTimeout(() => mr.state === "recording" && mr.stop(), 90000)};  // tope de 90 s
  mr.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
  mr.onstop = async () => {
    clearTimeout(rec.timer); stream.getTracks().forEach(t => t.stop());
    const blob = new Blob(chunks, {type: mr.mimeType || mime || "audio/webm"}); rec = null;
    btn.classList.remove("rec"); btn.textContent = "…"; btn.disabled = true;
    try{
      if(blob.size < 1500) throw new Error("no se escuchó nada");
      const r = await api("/api/voz/transcribir", {method:"POST", headers:{"Content-Type": blob.type}, body: blob});
      const j = await r.json().catch(() => ({}));
      if(!r.ok) throw new Error(j.detail || ("HTTP " + r.status));
      const input = $(p.el, ".ask input");
      if(j.texto){ input.value = (input.value ? input.value + " " : "") + j.texto; input.focus(); micStatus(p, `Transcripto en esta PC: «${esc(j.texto)}» <small>— revisalo y apretá Enviar</small>`); }
      else micStatus(p, "No entendí nada: probá de nuevo.");
    }catch(e){ micStatus(p, "No se pudo transcribir: " + esc(e.message || e)); }
    finally{ btn.textContent = "🎙"; pintarVoz(); }
  };
  mr.start(); btn.classList.add("rec"); btn.textContent = "⏹"; btn.disabled = false;
  btn.title = "Grabando… tocá de nuevo para terminar";
}

// ---------- EFÍMEROS EN VIVO (tablero global, polling cada 2 s a /api/efimeros) ----------
let LIVE = {activos:[], recientes:[], skew:0};
const hhmmss = ts => new Date(ts * 1000).toLocaleTimeString("es-AR", {hour12:false});
const fmtSec = n => { n = Math.max(0, Math.floor(n)); return n >= 60 ? Math.floor(n/60) + " min " + (n%60) + " s" : n + " s"; };

function buildVivoPane(t, el){
  el.innerHTML = `
    <div class="phead"><div class="pic">${t.icon}</div>
      <div><h2>Efímeros en vivo</h2><p class="sub">AYUDANTES QUE ESTÁN CORRIENDO AHORA · TODAS LAS BRIGADAS</p></div>
      <div class="meta">Se crean por tarea y mueren.<br><b>Tablero en tiempo real</b> (se actualiza cada 2 s)</div></div>
    <div class="cols two">
      <div class="card grow" style="--c:var(--orange)"><h3>CORRIENDO AHORA <span class="live on"><i></i>EN VIVO</span></h3>
        <div class="list" id="vactivos"><div class="empty">—</div></div></div>
      <div class="card grow" style="--c:var(--muted)"><h3>TERMINARON HACE POCO</h3>
        <div class="list" id="vrecientes"><div class="empty">—</div></div></div>
    </div>`;
  const p = {el, busy:false, tab:t, live:true};
  setTimeout(() => renderVivo(p), 0);
  return p;
}

function renderVivo(p){
  const act = $(p.el, "#vactivos"), rec = $(p.el, "#vrecientes"); if(!act || !rec) return;
  act.innerHTML = (LIVE.activos||[]).map(a => `<div class="note vrow">
      <div class="nt">⚡ <b>${esc(a.brigada_nombre||a.brigada)}</b> › ${esc(a.ayudante)} <small style="font-weight:400;color:var(--muted)">· ${esc(a.modo)} · ${esc(a.modelo)}</small></div>
      <div class="nm">${a.tool ? "usando " + esc(LABEL[a.tool]||a.tool) + (a.args ? " <small>" + esc(a.args) + "</small>" : "") : "pensando…"} · paso ${Number(a.pasos)||0}</div>
      <div class="nm">desde ${hhmmss(a.desde)} · <b class="vel" data-desde="${Number(a.desde)}">${fmtSec(a.segundos)}</b> · tarea: ${esc(a.tarea)}</div></div>`).join("")
    || '<div class="empty">Ningún efímero corriendo ahora. Cuando una brigada delegue una tarea en un ayudante, aparece acá en vivo.</div>';
  rec.innerHTML = (LIVE.recientes||[]).map(r => `<div class="note"><div class="nt" style="font-weight:500">${r.resultado === "ok" ? "✓" : "✗"} ${esc(r.brigada_nombre||r.brigada)} › ${esc(r.ayudante)}
      <small style="font-weight:400;color:${r.resultado === "ok" ? "var(--green)" : "var(--red)"}">· ${esc(r.resultado)} · ${fmtSec(r.segundos)}</small></div>
      <div class="nm">${esc(r.tarea)}${r.detalle ? "<br>" + esc(r.detalle) : ""}</div></div>`).join("")
    || '<div class="empty">Todavía no terminó ninguno desde que arrancó el orquestador.</div>';
}

async function pollVivo(){
  try{
    const r = await api("/api/efimeros"); if(!r.ok) throw 0;
    const j = await r.json();
    LIVE = {...j, skew: (j.ahora||0) - Date.now()/1000};
  }catch{ return; }
  const n = (LIVE.activos||[]).length, chip = document.getElementById("vivochip");
  if(chip){ chip.classList.toggle("hot", n > 0); chip.innerHTML = `⚡ <b>${n}</b> efímero${n === 1 ? "" : "s"} en vivo`; }
  const p = panes["vivo"]; if(p && p.el.classList.contains("on")) renderVivo(p);
}
document.getElementById("vivochip").onclick = () => select("vivo");
setInterval(pollVivo, 2000);
setInterval(() => {  // el reloj de cada efímero corre cada segundo, sin esperar al siguiente polling
  const now = Date.now()/1000 + (LIVE.skew||0);
  document.querySelectorAll(".vel").forEach(e => { e.textContent = fmtSec(now - Number(e.dataset.desde)); });
}, 1000);

let start = "orq"; try{ start = sessionStorage.getItem("tab") || "orq"; }catch{}
select(start);
loadMeta();
loadBrigadas();
pollVivo();
loadVoz();
</script>
