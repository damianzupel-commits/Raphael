[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raphael-encargos"
dynamic = ["version"]
description = "Brigada Encargos: toma pedidos a medida, sugiere el presupuesto y lleva los estados."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["raphael-harness>=0.1,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points."raphael.brigadas"]
encargos = "raphael_encargos:Encargos"

[tool.setuptools.dynamic]
version = {attr = "raphael_encargos.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
